lass=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> cancer. It was at the moment that I decided to break the rule. I picked him up and held him in my arms. <span class=\"mk mk-g\" data-for=\"7\">What</span> <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> me was that two days later, I was <span class=\"mk mk-k\" data-for=\"7\">informed of his death</span> and faced with a lawsuit filed by his parents. I thought I had no choice at that time, but it turned out I was just not rational enough when Billy <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> <span class=\"mk mk-g\" data-for=\"8\">his worries to me</span> and showed his vulnerability. After all, out of empathy, I was not giving too much thought to the reasoning behind these rules. Reflecting on that moment, I understand now that compassion alone can’t always justify breaking the rules, even when the heart says otherwise."], "blanks": {"1": {"ans": 5, "note": "provide + 名詞 and care：跟 care 並列的名詞 → 溫暖"}, "2": {"ans": 2, "note": "a + 形容詞 + gift：提醒我要感恩 → 有意義的"}, "3": {"ans": 0, "note": "looking pale and + 形容詞，兩個形容詞並列 → 虛弱的"}, "4": {"ans": 7, "note": "pass on germs：傳播病菌"}, "5": {"ans": 6, "note": "those + 複數名詞 + in his eyes → 眼中的光芒"}, "6": {"ans": 1, "note": "___ cancer 需要形容詞 → 末期的"}, "7": {"ans": 3, "note": "What + 動詞 + me was…：過去式動詞 → 使痛苦"}, "8": {"ans": 4, "note": "confide + 事 + to + 人：吐露心事"}}, "bank": [["A", "frail"], ["B", "terminal"], ["C", "rewarding"], ["D", "pained"], ["E", "confided"], ["AB", "warmth"], ["AC", "sparkles"], ["AD", "germs"]]}, {"t": "bank", "school": "南港", "html": ["McDonald’s originated in 1940 as a small drive-in restaurant opened by brothers Richard and Maurice McDonald in San Bernardino, California. Initially, the McDonald brothers <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-k\" data-for=\"1\">a traditional carhop drive-in</span> with an extensive menu, but in 1948, they <span class=\"mk mk-g\" data-for=\"2\">simplified</span> the menu to focus on a few staple items—hamburgers, fries, and beverages—and <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> the “Speedee Service System,” an innovative approach to fast, efficient food preparation, which laid the foundation for modern fast food. The business <span class=\"mk mk-g\" data-for=\"3\">caught the</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> of Ray Kroc, a milkshake machine salesman, in 1954. Intrigued by the efficiency of the brothers’ operation and the potential for expansion, Kroc <span class=\"mk mk-g\" data-for=\"4\">partnered with them,</span> <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> the first McDonald’s franchise in Des Plaines, Illinois, in 1955. In the same year, Kroc founded the McDonald’s Corporation, with the <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-g\" data-for=\"5\">of expanding</span> the brand nationwide.", "In 1961, Kroc bought out the McDonald brothers for $2.7 million, <span class=\"mk mk-g\" data-for=\"6\">gaining full</span> <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> of the company. Under Kroc’s leadership, McDonald’s experienced <span class=\"mk mk-k\" data-for=\"7\">rapid expansion</span>, <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> his focus on franchising, standardized operations, and aggressive marketing strategies. Iconic menu <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> like the <span class=\"mk mk-k\" data-for=\"8\">Big Mac</span> (introduced in 1967) and the Happy Meal (introduced in 1979) became global staples. However, the company also faced challenges, <button class=\"pb\" data-n=\"9\" data-part=\"0\">(9)</button> <span class=\"mk mk-k\" data-for=\"9\">criticism over</span> labor practices, environmental impact, and the healthiness of its menu. In response to <span class=\"mk mk-g\" data-for=\"10\">evolving consumer</span> <button class=\"pb\" data-n=\"10\" data-part=\"0\">(10)</button>, McDonald’s has introduced healthier options and sustainability initiatives in recent years. Today, with over 38,000 locations in more than 100 countries, McDonald’s remains one of the most successful fast-food chains worldwide."], "blanks": {"1": {"ans": 1, "note": "主詞後缺過去式動詞：「經營」傳統免下車餐廳"}, "2": {"ans": 4, "note": "和 simplified 並列的過去式動詞 → 推出系統"}, "3": {"ans": 3, "note": "catch the attention of + 人：引起…的注意"}, "4": {"ans": 2, "note": "partnered with them, + V-ing：分詞構句表接著發生的事"}, "5": {"ans": 5, "note": "with the + 名詞 + of V-ing：以…為目標"}, "6": {"ans": 8, "note": "gain full control of：取得完全控制權"}, "7": {"ans": 9, "note": "快速擴張「多虧」他的策略 → thanks to + 名詞"}, "8": {"ans": 7, "note": "menu items 菜單品項，後面舉 Big Mac 為例"}, "9": {"ans": 6, "note": "challenges, including + 例子：包括…"}, "10": {"ans": 0, "note": "evolving consumer + 名詞 → 消費者需求"}}, "bank": [["A", "demands"], ["B", "ran"], ["C", "opening"], ["D", "attention"], ["E", "introduced"], ["AB", "goal"], ["AC", "including"], ["AD", "items"], ["AE", "control"], ["BC", "thanks to"]]}, {"t": "bank", "school": "板橋", "html": ["For thousands of years, wigs have been used as fashion accessories, disguises, or simply to cover up hair loss. While people have been using them to <span class=\"mk mk-k\" data-for=\"1\">transform their</span> <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> for most of human history, their roles in society have changed over time.", "The earliest wigs we know of <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-k\" data-for=\"2\">around 3000 BC</span> in Egypt. Back then, only rich and powerful people wore wigs, making them a status symbol. Meanwhile, in ancient Greece and Rome, wigs were mainly used in <span class=\"mk mk-k\" data-for=\"3\">theater</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button>. However, wigs <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> in Europe during the Middle Ages because churches had a lot of influence in society at the time, <span class=\"mk mk-k\" data-for=\"4\">condemned</span> them as “badges of the devil”. But as the church lost some of its power in the Renaissance period, wigs <span class=\"mk mk-c\" data-for=\"4\">made a comeback</span> and became popular once again, largely thanks to Queen Elizabeth I in England. She owned over 80 wigs and used them to <span class=\"mk mk-k\" data-for=\"5\">hide her</span> <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> hair.", "Nobody boosted the popularity of wigs more than King Louis XIV of France. During his reign, wigs became <span class=\"mk mk-k\" data-for=\"6\">a necessity</span> for nobles in Europe. Known for his lavish lifestyle, the king himself loved wearing long, flowing wigs, and other royals and nobles followed his lead, making wigs <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> accessories in elite circles. The king’s influence lasted, and wigs became associated with <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> professions. For example, <span class=\"mk mk-k\" data-for=\"7\">judges and lawyers</span> still wear wigs in England as symbols of authority today. Since ancient times, wigs have been an important tool for <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> and <span class=\"mk mk-k\" data-for=\"8\">self-expression</span>. Most likely, they will continue to play a significant role in many people’s lives long into the future."], "blanks": {"1": {"ans": 4, "note": "transform their + 名詞 → 改變外表"}, "2": {"ans": 1, "note": "最早的假髮「追溯到」西元前 3000 年"}, "3": {"ans": 3, "note": "theater + 名詞 → 戲服"}, "4": {"ans": 6, "note": "教會譴責 → 退流行；後面 made a comeback 是反方向"}, "5": {"ans": 5, "note": "hide her + 形容詞 + hair → 日漸稀疏的"}, "6": {"ans": 0, "note": "前一句說假髮是 necessity → 必要的配件"}, "7": {"ans": 7, "note": "「特定」職業，後面舉法官、律師為例"}, "8": {"ans": 2, "note": "tool for ___ and self-expression：兩個名詞並列"}}, "bank": [["A", "essential"], ["B", "date back to"], ["C", "creativity"], ["D", "costumes"], ["E", "appearances"], ["AB", "thinning"], ["AC", "fell out of fashion"], ["AD", "specific"]]}, {"t": "struct", "school": "南港", "html": ["Caring for a child with a terminal illness requires both emotional strength and practical knowledge. <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-g\" data-for=\"1\">This includes</span> addressing the child’s physical, emotional, and psychological needs while also supporting the family.", "First, it is important to establish effective communication with healthcare professionals. Palliative care, which focuses on <span class=\"mk mk-k\" data-for=\"2\">relieving symptoms</span> and improving the quality of life, plays a crucial role. <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-g\" data-for=\"2\">It can ensure</span> that the child remains as comfortable as possible.", "Emotional care is just as important. Children may experience fear, sadness, or confusion about their condition. Providing a safe space where they can <span class=\"mk mk-k\" data-for=\"3\">express their feelings</span> is essential. <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> Support from family, counselors, and spiritual care providers can offer comfort.", "<button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> Engaging in <span class=\"mk mk-k\" data-for=\"4\">activities that bring joy</span>, such as playing games, watching favorite movies, or spending time outdoors, can provide comfort and distraction.", "Parents and caregivers should also take care of their own emotional well-being. <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> Seeking support from friends, family, or professional counselors is important to cope with <span class=\"mk mk-g\" data-for=\"5\">these challenges</span>."], "blanks": {"1": {"ans": 2, "note": "段落第一句後的主旨句；下一句 This includes 指的就是這個 goal 的內容"}, "2": {"ans": 3, "note": "緩和照護減輕症狀 → 醫護幫忙控制疼痛；下一句 It 接著說照護效果"}, "3": {"ans": 1, "note": "情緒照顧：讓孩子表達感受 → 鼓勵坦誠對話降低焦慮"}, "4": {"ans": 4, "note": "新段第一句；後面舉遊戲、電影為例 → 維持正常生活感"}, "5": {"ans": 0, "note": "照顧者自己的情緒：壓力與悲傷 → 後面 these challenges 呼應"}}, "sents": ["The stress and grief of caring for a terminally ill child can be overwhelming.", "Encouraging open, honest conversations can help reduce their anxiety.", "The primary goal is to ensure the child’s comfort and well-being during this difficult time.", "Doctors and nurses can help manage pain, nausea, and other discomforts.", "At the same time, it’s vital to maintain a sense of normalcy in the child’s life."]}, {"t": "read", "school": "永平", "html": ["Team members always depend on each other. Therefore, <span class=\"mk mk-k\" data-for=\"q0\">it is important to develop team spirit</span>, whether in a class, a group, or a company. Team spirit, however, is not an <span class=\"mk mk-k\" data-for=\"q1\">inherent</span> quality; it <span class=\"mk mk-k\" data-for=\"q0\">must be learned and developed</span> through experience. Below are five tips for developing stronger team spirit. Tip 1: <span class=\"mk mk-k\" data-for=\"q2\">Encourage Open Communication</span> Communication matters in all relationships. Create an open atmosphere that allows everyone to voice his or her ideas and opinions comfortably.", "Tip 2: Organize Team Activities <span class=\"mk mk-k\" data-for=\"q3\">Arrange interesting games</span> that provide team members with a chance to participate, play, and enjoy themselves as a team. The purpose of doing so is for members to get together for fun, not just for work. Tip 3: <span class=\"mk mk-k\" data-for=\"q2\">Avoid In-Group Competitions</span> Everyone on a team has different weaknesses and strengths. Unhealthy competition between and among members can prevent a team from developing. Members should learn from each other and cooperate in order to <span class=\"mk mk-k\" data-for=\"q2\">achieve a common team goal</span>.", "Tip 4: Praise Publicly Show appreciation for team members who do well by <span class=\"mk mk-k\" data-for=\"q2\">praising their good deeds in public</span>. This way, team members can have a clearer idea of what is appreciated.", "Tip 5: Provide Chances for Learning <span class=\"mk mk-k\" data-for=\"q2\">Make learning opportunities available</span> to all members. The more members learn, the better they can contribute to the team. The skills members bring to the team will benefit the whole group."], "qs": [{"q": "What is the main idea of the passage?", "opts": ["Team members should avoid making mistakes in communication.", "*Team spirit is essential but must be developed through effort.", "Competitions within a team can encourage members to work harder.", "Learning individually is more important than cooperating in a group."], "multi": false, "ex": "第一段先說團隊精神很重要，再說它不是天生的、要透過經驗培養，後面五個 Tip 都是培養方法。"}, {"q": "Which word in the passage is closest in meaning to “natural / existing as a basic part”?", "opts": ["*inherent", "common", "comfortable", "interesting"], "multi": false, "ex": "inherent＝與生俱來的、固有的。not an inherent quality 就是「不是天生的特質」。"}, {"q": "Which activities are good for developing team spirit, according to the text?", "opts": ["*Tasks that require team members to work together and achieve a common goal.", "*Celebrations or recognition events to celebrate team accomplishments.", "*Opportunities for team members to develop skills that contribute to the team’s growth.", "Personality tests for team members that they can discuss to understand each other.", "Problem-solving tasks that team members compete to solve.", "*Interactive activities that focus on improving communication and cooperation skills."], "multi": true, "ex": "(A) 對應 Tip 3 共同目標；(B) 對應 Tip 4 公開稱讚；(C) 對應 Tip 5 學習機會；(F) 對應 Tip 1 溝通。(E) 讓成員互相競爭，違反 Tip 3；(D) 文中沒提。"}, {"q": "What does the phrase “doing so” in Tip 2 refer to?", "opts": ["*arranging interesting games (organizing team activities)", "creating an open atmosphere", "praising members in public", "avoiding in-group competitions"], "multi": false, "ex": "doing so 代替前一句的動作：Arrange interesting games。"}]}]}, {"key": "PL2", "name": "L2 題本", "emoji": "🍡", "lead": "Marshmallow Challenge：棉花糖挑戰", "cards": [{"t": "cloze", "school": "新北", "html": ["Have you ever heard of a game of using food to build a tall tower? The Marshmallow Challenge is one such game where students can learn about the importance of <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button>, <span class=\"mk mk-k\" data-for=\"1\">creativity</span>, and problem-solving skills. In this activity, teams are given 20 sticks of spaghetti, a roll of tape, a yard of string, and a marshmallow to <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-k\" data-for=\"2\">a way of building</span> the tallest tower possible in mere 18 minutes. <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-k\" data-for=\"3\">limitations</span> on time and materials, teams <span class=\"mk mk-k\" data-for=\"3\">give their all</span> to build the tallest free-standing structure. A study about the challenge shows that learning from mistakes can help teams improve. On the contrary, those who <span class=\"mk mk-g\" data-for=\"4\">spend too much time</span> <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> often fail to build their towers. What’s more, this study also suggests that successful teams work together naturally, and <span class=\"mk mk-g\" data-for=\"5\">the results of teamwork</span> are often better than <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> of independent work."], "blanks": {"1": {"ans": 2, "note": "和 creativity、problem-solving 並列的名詞；團隊活動 → 合作"}, "2": {"ans": 2, "note": "figure out a way：想出辦法"}, "3": {"ans": 1, "note": "有限制「儘管」如此還是全力以赴 → Despite + 名詞"}, "4": {"ans": 0, "note": "spend time + V-ing"}, "5": {"ans": 3, "note": "代替前面的複數名詞 results → those"}}, "opts": {"1": ["reasoning", "motto", "collaboration", "longevity"], "2": ["confide to", "take in", "figure out", "make up"], "3": ["From", "Despite", "For", "Besides"], "4": ["planning", "to plan", "planned", "plan"], "5": ["else", "others", "some", "those"]}}, {"t": "cloze", "school": "永平", "html": ["Teamwork is vital for achieving business goals. One of the most popular team-building games, <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-k\" data-for=\"1\">the Marshmallow Challenge</span>, has been widely conducted with people around the world. Participants need to work together to build the tallest tower out of dried spaghetti, with a marshmallow placed on the top. Tom Wujec, the advocate of the team-building game, has revealed surprising results after <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button><span class=\"mk mk-k\" data-for=\"2\">the game among</span> diverse groups. As <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button>, the groups <button class=\"pb\" data-n=\"3\" data-part=\"1\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">the tallest structure</span> were architects and engineers. Nevertheless, kindergartners surprisingly performed better than the other adult teams.", "Why did children do so well? <span class=\"mk mk-c\" data-for=\"6\">One reason</span> for this is that kids <span class=\"mk mk-k\" data-for=\"4\">start working right away</span>, <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> adults such as lawyers or CEOs often <span class=\"mk mk-k\" data-for=\"4\">spend too much time planning</span>, leaving little time to adjust their design. <span class=\"mk mk-c\" data-for=\"6\">Another reason</span> is kindergartners’ approach to problem-solving. Unlike adults, children don’t waste time discussing the best solution. Instead, they take immediate action and constantly experiment with new ideas. Thus, <span class=\"mk mk-g\" data-for=\"5\">the structures built by children</span> are stronger than <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> created by adults. <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> reason is that kindergartners embrace simpler ways of thinking. Business students and lawyers are trained to believe in one right answer, and they usually don’t <span class=\"mk mk-k\" data-for=\"7\">start building unless</span> they think they have found the right answer. Kindergartners just <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> <span class=\"mk mk-k\" data-for=\"7\">and try the ideas</span> they have. The finding reminds us that sometimes keeping things simple can lead to greater success than complicated plans."], "blanks": {"1": {"ans": 2, "note": "known as + 名稱：被稱為…"}, "2": {"ans": 1, "note": "執行、進行遊戲 → carrying out"}, "3": {"ans": 2, "note": "As expected 如預期；the groups building…（團隊主動搭建 → V-ing）"}, "4": {"ans": 3, "note": "孩子立刻動手 vs. 大人花太多時間規劃 → 對比 whereas"}, "5": {"ans": 3, "note": "代替複數 structures → those"}, "6": {"ans": 0, "note": "One reason… Another reason… 第三個理由 → Still another"}, "7": {"ans": 1, "note": "大人要等答案才動手；孩子「直接投入」任務"}}, "opts": {"1": ["knowing for", "is known for", "known as", "knowing as"], "2": ["figuring out", "carrying out", "relying on", "focusing on"], "3": ["expected; built", "expecting; building", "expected; building", "expecting; having built"], "4": ["so", "therefore", "for", "whereas"], "5": ["that", "which", "these", "those"], "6": ["Still another", "The other", "Another", "The one"], "7": ["make up for the mistakes", "get down to the task", "pass on information to the others", "move on to the next"]}}, {"t": "cloze", "school": "景美", "html": ["In our teamwork class, we tried the famous Marshmallow Challenge, a creative exercise that uses twenty sticks of spaghetti, tape, string, and a marshmallow. The task was to build the tallest <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-k\" data-for=\"1\">structure that could hold</span> the marshmallow on top. We had only 18 minutes, so collaboration was necessary.", "The results of this challenge, recorded in Tom Wujec’s worldwide studies, reveal fascinating contrasts. Architects and engineers, as expected, <span class=\"mk mk-k\" data-for=\"2\">achieved the highest</span> structures, <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> lawyers produced results <span class=\"mk mk-k\" data-for=\"2\">well below average</span>. CEOs managed to perform slightly better than the majority, but the most astonishing outcome was that kindergartners, whose playful strategies relied on constant experiments, <span class=\"mk mk-g\" data-for=\"3\">built towers taller than</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> of many trained adults.", "Their success can be explained by their <span class=\"mk mk-k\" data-for=\"4\">immediate action</span> and constant <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button>. Instead of endless planning, children tested ideas, <span class=\"mk mk-k\" data-for=\"4\">received instant feedback</span>, and cooperated naturally without wasting energy <span class=\"mk mk-k\" data-for=\"5\">deciding who was</span> <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button>. The lesson is clear: effective teamwork requires flexibility, experimentation, and collaboration rather than overconfidence in complex but untested plans."], "blanks": {"1": {"ans": 0, "note": "free-standing 自己站得住的（複合形容詞）"}, "2": {"ans": 2, "note": "建築師最高 vs. 律師遠低於平均 → 對比 while"}, "3": {"ans": 3, "note": "代替複數 towers → those"}, "4": {"ans": 1, "note": "和 action 並列的名詞；邊做邊得到回饋 → 調整"}, "5": {"ans": 0, "note": "決定誰「負責」→ who was in charge"}}, "opts": {"1": ["free-standing", "free-stood", "standing-free", "stood-free"], "2": ["although", "since", "while", "so"], "3": ["them", "ones", "these", "those"], "4": ["punishment", "adjustment", "banishment", "employment"], "5": ["in charge", "turned down", "cheered up", "given a hand"]}}, {"t": "cloze", "school": "南湖", "html": ["Most people assume that adults, <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> their <span class=\"mk mk-k\" data-for=\"1\">experience and reasoning</span>, would perform better in teamwork tasks. Yet a simple classroom game has shown the opposite. <span class=\"mk mk-g\" data-for=\"2\">The Marshmallow Challenge,</span> <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> an activity that tests creativity and cooperation, has been carried out with groups of all ages around the world. In this challenge, each team must build a tower out of spaghetti, tape, and string. Success is measured by the height of the tower—and to everyone’s surprise, kindergartners often outperform adults.", "One reason for this is that they begin without delay. They grab the spaghetti and <span class=\"mk mk-g\" data-for=\"3\">test ideas as they build,</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> their designs as needed. Adults, by contrast, spend precious minutes discussing plans before they even begin—time that could have been used for construction. Having only eighteen minutes, a quick start often proves to be the key to success. Another reason is kindergartners’ <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">approach</span>: <span class=\"mk mk-c\" data-for=\"5\">rather than planning</span>, they rely on <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button>. They test ideas immediately and <span class=\"mk mk-k\" data-for=\"5\">adjust along the way</span>. In unfamiliar conditions, experimenting right away works better than planning with limited information. Finally, kindergartners simply focus on their goal without worrying about who’s the leader. Adults may <span class=\"mk mk-k\" data-for=\"6\">argue about roles</span> or ideas, <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> kindergartners <span class=\"mk mk-k\" data-for=\"6\">just build</span>. Next time you’re facing a challenge, maybe you should think like a kindergartner!"], "blanks": {"1": {"ans": 2, "note": "with + 名詞：擁有…（經驗與推理能力）"}, "2": {"ans": 1, "note": "known as + 名稱：被稱為…"}, "3": {"ans": 2, "note": "邊搭邊測試，同時調整 → 分詞構句 V-ing"}, "4": {"ans": 0, "note": "problem-solving approach：複合形容詞"}, "5": {"ans": 2, "note": "不規劃，而是依靠「反覆嘗試」"}, "6": {"ans": 3, "note": "大人爭論 vs. 孩子直接搭 → 對比 whereas"}}, "opts": {"1": ["from", "by", "with", "upon"], "2": ["known by", "known as", "known for", "known to"], "3": ["to adjust", "adjust", "adjusting", "and adjusting"], "4": ["problem-solving", "problem-solved", "solve-problem", "solving-problem"], "5": ["pros and cons", "ups and downs", "trial and error", "trick or treat"], "6": ["since", "unless", "once", "whereas"]}}, {"t": "cloze", "school": "松山", "html": ["The marshmallow challenge seemed straightforward when our instructor explained the rules last Tuesday in our business management class. After receiving 20 sticks of uncooked spaghetti, one yard of tape, one yard of string, and a marshmallow, we were <span class=\"mk mk-k\" data-for=\"1\">eager to</span> <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> the challenge of building the tallest possible structure. My teammates and I, all confident business students from different specializations, assumed our project management skills and analytical thinking would <span class=\"mk mk-k\" data-for=\"2\">guarantee victory</span> in this 18-minute <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button>.", "Our teamwork started smoothly as we assigned roles and sketched our initial design on paper, but problems emerged quickly when we began construction. <span class=\"mk mk-g\" data-for=\"3\">Contrary to</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">we expected</span>, our impressive-looking design failed to support even a single marshmallow at the top. We realized that trial and error was our only path forward as we tested different base structures and experimented with various support techniques to stabilize our tower. <span class=\"mk mk-c\" data-for=\"4\">Nevertheless</span>, our structure <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> when the other teams succeeded in building stable towers one after another, which put us <span class=\"mk mk-k\" data-for=\"4\">under great pressure</span>. <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button>, <span class=\"mk mk-k\" data-for=\"5\">this setback revealed</span> important insights about teamwork and humility. The experience taught me more than textbooks could about the importance of flexibility, patience, and effective communication under stress. <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> our initial failures, we <span class=\"mk mk-k\" data-for=\"6\">proved ourselves capable</span> of learning from mistakes and supporting each other through frustration. In the end, we managed to build a stable tower that stood for the full duration, though not the tallest."], "blanks": {"1": {"ans": 3, "note": "迫不及待「投入」挑戰 → get down to"}, "2": {"ans": 1, "note": "guarantee victory、18 分鐘 → 這是一場競賽"}, "3": {"ans": 2, "note": "contrary to what we expected：what 當 expected 的受詞"}, "4": {"ans": 3, "note": "Nevertheless 轉折：別隊成功，我們卻「一再倒塌」"}, "5": {"ans": 0, "note": "前面壓力很大，後面卻帶來重要體悟 → 轉折 Yet"}, "6": {"ans": 0, "note": "雖然一開始失敗，仍證明能學習 → Despite + 名詞"}}, "opts": {"1": ["make up for", "build on", "compete for", "get down to"], "2": ["contribution", "competition", "association", "observation"], "3": ["how", "that", "what", "which"], "4": ["survived physically", "appeared regularly", "completed immediately", "collapsed repeatedly"], "5": ["Yet", "Thus", "Instead", "Furthermore"], "6": ["Despite", "Concerning", "Besides", "For"]}}, {"t": "cloze", "school": "西松", "html": ["I once joined the Marshmallow Challenge, a creative team-building ing been tried", "is tried"], "3": ["one", "those", "others", "that"], "4": ["Unlike", "As for", "Like", "More than"], "5": ["learned", "and learning", "as learned", "learning"]}}, {"t": "cloze", "school": "成淵", "html": ["The Marshmallow challenge, a team-building exercise, promoted by Canadian technology expert Tom Wujec, has been conducted worldwide. With 20 sticks of spaghetti, a yard of tape, a yard of string, and one marshmallow, in 18 minutes, teams compete to build the tallest free-standing structure <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-g\" data-for=\"1\">supporting the weight</span> of one marshmallow at the top. Over the years, Wujec’s study revealed surprising results that the structures of the kindergarten group <span class=\"mk mk-g\" data-for=\"2\">are taller than</span> <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> of most of the adult teams to achieve the second best performance.", "The impressive performance of the kindergarten group can be explained by several reasons. <span class=\"mk mk-c\" data-for=\"5\">One reason</span> is that children <span class=\"mk mk-k\" data-for=\"3\">begin immediately</span> and use available materials <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">spending most of their time</span> on planning. Adults often invest heavily in planning, leaving little time to test or adjust their designs when the marshmallow cannot be supported. <span class=\"mk mk-c\" data-for=\"5\">Another reason</span> is that children are quicker to change methods after failure. They rely on <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> and <span class=\"mk mk-k\" data-for=\"4\">move rapidly from one attempt to the next</span>. This strategy gives them immediate feedback about which design elements provide both height and stability. <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> reason is that children
