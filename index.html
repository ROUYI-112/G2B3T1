ether", "when", "where"], "7": ["them", "that", "which", "those"], "8": ["in spite of", "instead of", "apart from", "in terms of"], "9": ["pros and cons", "ups and downs", "trial and error", "give and take"]}}, {"t": "bank", "school": "新店", "html": ["For a national design competition, our team took on the challenge of creating a new community center. We knew a complex task like this <span class=\"mk mk-g\" data-for=\"1\">required a solid</span> <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button>, so we divided the work into clear stages: research, initial design, and final model building. We wanted our final design to be truly <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button>, something the judges had <span class=\"mk mk-k\" data-for=\"2\">never seen before</span>.", "Our initial ideas were not perfect, but we improved them through <span class=\"mk mk-g\" data-for=\"3\">a process of</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button>. This meant we <span class=\"mk mk-g\" data-for=\"4\">often had to</span> <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> our original designs to make them better. We quickly learned that <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-g\" data-for=\"5\">as a team</span> was much more effective than <span class=\"mk mk-k\" data-for=\"5\">working alone</span>. For inspiration, we studied the amazing <span class=\"mk mk-g\" data-for=\"6\">work of famous</span> <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> from around the world. <span class=\"mk mk-g\" data-for=\"7\">The next step was to</span> <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> a scale model based on our final drawings. After several weeks of dedicated effort, our team felt <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> <span class=\"mk mk-g\" data-for=\"8\">of building</span> something impressive. <span class=\"mk mk-g\" data-for=\"9\">We enjoyed</span> <button class=\"pb\" data-n=\"9\" data-part=\"0\">(9)</button> <span class=\"mk mk-k\" data-for=\"9\">with different styles</span> for the roof and windows. To turn our idea into something concrete, we carefully selected our <button class=\"pb\" data-n=\"10\" data-part=\"0\">(10)</button>, using <span class=\"mk mk-k\" data-for=\"10\">real wood pieces</span> for the walls and clear acrylic for the windows to create a realistic, modern look."], "blanks": {"1": {"ans": 8, "note": "a solid + 名詞：穩固的結構"}, "2": {"ans": 5, "note": "truly + 形容詞；評審從沒見過 → 獨特的"}, "3": {"ans": 2, "note": "a process of + 名詞 → 反覆嘗試的過程"}, "4": {"ans": 6, "note": "had to + 原形動詞 → 調整"}, "5": {"ans": 7, "note": "that 子句的主詞用 V-ing；as a team 對比 working alone"}, "6": {"ans": 4, "note": "the work of famous + 複數名詞 → 建築師"}, "7": {"ans": 3, "note": "to + 原形動詞；做一個縮尺模型 → construct"}, "8": {"ans": 0, "note": "feel capable of V-ing：覺得有能力做…"}, "9": {"ans": 1, "note": "enjoy + V-ing；experiment with 嘗試…"}, "10": {"ans": 9, "note": "selected our + 名詞；後面列木片、壓克力 → 材料"}}, "bank": [["A", "capable"], ["B", "experimenting"], ["C", "trial and error"], ["D", "construct"], ["E", "architects"], ["AB", "unique"], ["AC", "adjust"], ["AD", "collaborating"], ["AE", "structure"], ["BC", "materials"]]}, {"t": "bank", "school": "育成", "html": ["An innovative team-building exercise <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-k\" data-for=\"1\">the Marshmallow Challenge,</span> promoted by Canadian technology expert Tom Wujec, has been conducted around the world with architects and engineers, CEOs, lawyers, business graduates, and even kindergartners. Over the years, the challenge has produced some surprising results. In Wujec’s study, the average <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> of the structures constructed was <span class=\"mk mk-k\" data-for=\"2\">20 inches</span>. The group that built the highest structure was, as expected, architects and engineers. CEOs performed <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">better than average</span>, coming in third. Lawyers performed below average, ranking second to last. And <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> working to create the best plan, business graduates <span class=\"mk mk-k\" data-for=\"4\">performed the worst</span>. Amazingly, kindergartners outperformed most of the adult teams to achieve the second-best performance. The impressive performance of the kindergartners, <span class=\"mk mk-g\" data-for=\"5\">whose structures were taller than</span> <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> of most adult teams, can be explained by three reasons related to their unique way of working. One reason is that kids usually get started with what has been given to them right away, whereas adults usually don’t <span class=\"mk mk-g\" data-for=\"6\">start putting the structure together</span> <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> they have spent most of the time planning, which leaves no time to adjust the design if it cannot support the marshmallow. Another reason is that <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> adults, kindergartners <span class=\"mk mk-k\" data-for=\"7\">are quicker to change</span> their methods after failed approaches. They rely on <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> - if one method doesn’t work, they <span class=\"mk mk-k\" data-for=\"8\">quickly move on to the next</span>. Still another reason is that children tend to collaborate freely and naturally. They don’t <span class=\"mk mk-g\" data-for=\"9\">waste time</span> <button class=\"pb\" data-n=\"9\" data-part=\"0\">(9)</button> who is in charge. Instead, they are more focused on working together to <button class=\"pb\" data-n=\"10\" data-part=\"0\">(10)</button> <span class=\"mk mk-g\" data-for=\"10\">how to build</span> the tallest structure."], "blanks": {"1": {"ans": 1, "note": "known as + 名稱"}, "2": {"ans": 2, "note": "the average + 名詞 + was 20 inches → 高度"}, "3": {"ans": 0, "note": "修飾 better 的副詞 → 稍微"}, "4": {"ans": 7, "note": "努力規劃「儘管」如此表現最差 → despite + V-ing"}, "5": {"ans": 8, "note": "代替複數 structures → those"}, "6": {"ans": 3, "note": "not…until：直到規劃完才「開始」組裝"}, "7": {"ans": 9, "note": "孩子「和大人不同」，失敗後換方法更快"}, "8": {"ans": 6, "note": "一種方法不行就換下一種 → 反覆嘗試"}, "9": {"ans": 5, "note": "waste time + V-ing"}, "10": {"ans": 4, "note": "to + 原形；figure out how to 想出如何…"}}, "bank": [["A", "slightly"], ["B", "known as"], ["C", "height"], ["D", "until"], ["E", "figure out"], ["AB", "deciding"], ["AC", "trial and error"], ["AD", "despite"], ["AE", "those"], ["BC", "unlike"]]}, {"t": "struct", "school": "華江", "html": ["Some inventions are the result of remarkable inspirations, while others are complete accidents. As of 1827, many people were trying to create a mixture of materials that would explode into fire but also burn slowly in a controlled manner. Drugstore owner and amateur scientist John Walker was working with chemicals and got some <span class=\"mk mk-k\" data-for=\"1\">on the end of a stick</span>. <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-g\" data-for=\"1\">That was the first matchstick</span>. Other than personal sales in his shop, Walker did not prosper from his invention—he let matchsticks be made universally by anybody.", "Wilhelm Conrad Röntgen was working with a special light when he noticed its rays. He used them to make <span class=\"mk mk-k\" data-for=\"2\">photographs on pieces of cardboard</span>. <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-c\" data-for=\"2\">So he tried</span> his wife’s hand—essentially taking the world’s first X-ray. For his contribution to physics, Röntgen was presented with a medal from the Nobel Prize committee in 1901. Like John Walker, Röntgen did not collect any earnings for the use of his invention.", "Perhaps the most famous accidental invention was Alexander Fleming’s. Fleming left his lab deserted for a month while he <span class=\"mk mk-k\" data-for=\"3\">went on vacation</span>. <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> He observed that there was an area <span class=\"mk mk-g\" data-for=\"3\">around the mold</span> where the bacteria had died. Fleming had discovered penicillin. Fleming would later modestly say, “<span class=\"mk mk-k\" data-for=\"4\">I did not invent penicillin.</span> <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> I only discovered it by accident.”", "These moments in history teach us that we should always keep our eyes open, even if we are clumsy or tend to have accidents."], "blanks": {"1": {"ans": 3, "note": "棍子沾到化學物 → 刷過地面起火 → 下一句 That was the first matchstick"}, "2": {"ans": 2, "note": "在紙板上拍照 → 有些物體出現有些沒有 → So 改拍太太的手"}, "3": {"ans": 4, "note": "去度假一個月 → 回來發現黴菌 → 下一句 the mold 呼應"}, "4": {"ans": 0, "note": "我沒有發明青黴素 → 是大自然做的（that 指 invent penicillin）"}}, "sents": ["Nature did that.", "The result was satisfying.", "It turned out that some objects appeared while others did not.", "He accidentally brushed the stick against the ground, and it burst into flame!", "Upon returning, the scientist discovered mold growing on culture dishes he had left out."]}, {"t": "read", "school": "北一", "html": ["Intuition is often praised as the key to decision making. Should you follow your gut, or is it more complicated?", "When asked about the source of his genius, Albert Einstein had no doubts. “I believe in intuitions and inspirations. I sometimes feel that I am right. I do not know that I am.” “It was much better to trust those instincts and test them later than to dismiss them out of hand,” he said. The physicist was <span class=\"mk mk-k\" data-for=\"q1\">by no means alone in this philosophy</span>. It was also, apparently, a big part of Coco Chanel’s strategy. “Fashion is in the air, born upon the wind. One intuits it,” she said.", "You may <span class=\"mk mk-k\" data-for=\"q2\">recognize the sensation</span> yourself. Whether you are looking at a new apartment, considering a possible new job or judging someone’s honesty, you may have an <span class=\"mk mk-k\" data-for=\"q2\">ineffable hunch</span> when something is right or wrong—without being able to explain the reasons for your judgment.", "In the past two decades, scientists have <span class=\"mk mk-k\" data-for=\"q3\">made enormous strides</span> in identifying the sources of <span class=\"mk mk-k\" data-for=\"q2\">our gut instincts</span> and <span class=\"mk mk-k\" data-for=\"q0\">their essential role in our lives</span>. Their research has identified the specific situations in which our intuition is likely to lead us on the right path or astray. The evidence for the importance of gut feelings is strongest in studies of lie detection. People tend to be more accurate at judging whether someone is lying about a particular event—if they are asked to go with their intuitions, compared to when they are asked to think it through and describe their reasons. In other situations, the strength of our intuitions will depend on the extent of our experiences. The unconscious brain searches through its stored knowledge to deal with our problems, without us consciously recalling the precise memories.", "Consider an experiment led by Erik Dane, a professor of management at Rice University. In 2012, his research team asked students to view a series of designer handbags—some were authentic products and some were realistic counterfeits. Half the participants were asked to ignore their gut instincts and list all the features they would look for to determine whether the handbag was real or fake. The rest were told to go with their intuitions. The researchers also questioned the participants about their buying habits and whether they owned many designer items.", "For the participants using the analytical approach, their previous experience made little difference: they all performed roughly the same. For the participants who had been asked to use their intuition, however, <span class=\"mk mk-k\" data-for=\"q4\">experience made a huge difference</span>—greatly increasing the accuracy of their gut reactions. However, researchers emphasize that people’s gut instincts <span class=\"mk mk-k\" data-for=\"q0\">should not replace analytical thought</span>, and we should be aware of the fact that they can sometimes be swayed by unconscious biases. If there is a chance that racism, ageism or sexism is clouding your judgment, you might be especially wary of what your gut is telling you."], "qs": [{"q": "Which of the following is the main idea of the passage?", "opts": ["It is hard for people to explain their reasons for their decisions made by using intuition.", "Be careful not to be influenced by unconscious biases when making decisions using intuition.", "In general, people make better decisions when going with their intuition than using an analytical approach.", "*Intuition can be important sources of information and should play some role in the decision-making process."], "multi": false, "ex": "全文說直覺很重要（Einstein、實驗），最後又提醒直覺不能取代分析 → 直覺應在決策中「扮演一定角色」。(A)(B) 只是細節，(C) 說得太絕對。"}, {"q": "Why are Albert Einstein and Coco Chanel mentioned in the second paragraph?", "opts": ["To challenge a decision.", "*To serve as examples.", "To make comparisons.", "To introduce a new idea."], "multi": false, "ex": "兩人都相信直覺，by no means alone 表示「不只他一個」→ 舉例說明。"}, {"q": "Which words are used in the passage to refer to intuition? a. instinct b. sensation c. gut d. genius e. judgment f. counterfeits g. hunch", "opts": ["a, c, d, g", "b, c, e, f", "*a, b, c, g", "a, b, d, e"], "multi": false, "ex": "gut instincts、the sensation、ineffable hunch 都在講直覺；genius 是天才，counterfeits 是仿冒品。"}, {"q": "Which phrase in the passage means “have made great progress or development”?", "opts": ["*made enormous strides", "by no means alone", "go with their intuitions", "out of hand"], "multi": false, "ex": "stride 是大步，made enormous strides＝有很大的進展。"}, {"q": "The finding of Erik Dane’s experiment shows that ______ plays an important role when people make a decision using intuition.", "opts": ["*experience", "analysis", "instinct", "bias"], "multi": false, "ex": "用直覺的那組，經驗造成很大差異；用分析的那組經驗沒差。"}]}]}, {"key": "PL3", "name": "L3 題本", "emoji": "🔥", "lead": "Prometheus：盜火者", "cards": [{"t": "cloze", "school": "景美", "html": ["Long ago, when the gods ruled the universe, the Titan Prometheus shaped the first humans out of clay. His brother Epimetheus was asked to give qualities to all creatures. He handed out speed, strength, and wings to animals, but <span class=\"mk mk-g\" data-for=\"1\">by the time he</span> <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> humans, he <button class=\"pb\" data-n=\"1\" data-part=\"1\">(1)</button> <span class=\"mk mk-k\" data-for=\"2\">out of gifts</span>.", "Wanting to <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> this, Prometheus <span class=\"mk mk-k\" data-for=\"2\">looked for a way to help</span>. He even tricked Zeus during a sacrifice, hiding the best meat for humans and offering the bones <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-k\" data-for=\"3\">in fat</span> to the god. When Zeus discovered the trick, he grew furious and denied humans fire. Prometheus, however, secretly stole fire and <span class=\"mk mk-k\" data-for=\"4\">gave it to people</span>. <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button>, humans <span class=\"mk mk-k\" data-for=\"4\">could cook food</span>, stay warm, and build tools. This gift also brought humans progress and civilization.", "But Zeus punished Prometheus harshly. He <span class=\"mk mk-g\" data-for=\"5\">chained Prometheus to a rock,</span> <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> an eagle came daily to peck his liver until much later Hercules came to his rescue."], "blanks": {"1": {"ans": 0, "note": "by the time + 過去式，主要子句用過去完成式"}, "2": {"ans": 2, "note": "禮物用完了 → Prometheus 想「彌補」"}, "3": {"ans": 1, "note": "bones (which were) covered in fat：被覆蓋 → 過去分詞"}, "4": {"ans": 3, "note": "偷火給人 →「結果」能煮食取暖"}, "5": {"ans": 3, "note": "a rock, where + 完整句：地點的關係副詞"}}, "opts": {"1": ["reached; had run", "had reached; ran", "reached; ran", "had reached; had run"], "2": ["make of", "make for", "make up for", "make way for"], "3": ["covering", "covered", "to cover", "with covering"], "4": ["In contrast", "Without a doubt", "On the other hand", "As a result"], "5": ["which", "that", "when", "where"]}}, {"t": "cloze", "school": "附中", "html": ["In the ancient cosmos, Prometheus, a Titan who created humankind from clay, found that his brother Epimetheus had run out of gifts for humanity. In order to make up for humans’ weak state, Prometheus <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-g\" data-for=\"1\">them to stand upright</span> like the gods. Kind-hearted, he also gave them fire, <span class=\"mk mk-g\" data-for=\"2\">an essential</span> <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> for warmth and cooking.", "Prometheus’s affection for humankind <span class=\"mk mk-g\" data-for=\"3\">brought him into</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">with Zeus</span>, the king of the Olympian gods. For the sake of humans, Prometheus tricked Zeus during a sacrificial offering and, in an act of disobedience, stole fire from the sun, hiding it within a hollow stalk, which he then delivered to humanity. Zeus, furious at this act, punished the Titan by chaining him to a rock and <span class=\"mk mk-g\" data-for=\"4\">having an eagle</span> <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> Prometheus’s liver. Though his liver kept growing back, the eagle would return every day to gnaw at it again. This eternal cycle of pain would continue until the end of time.", "Yet, through his sacrifice, Prometheus, who had <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-k\" data-for=\"5\">human civilization</span>, came to be known as the “Champion of Humankind.”"], "blanks": {"1": {"ans": 1, "note": "enable + 受詞 + to V：使能夠"}, "2": {"ans": 0, "note": "an essential + 名詞 + for warmth → 要素"}, "3": {"ans": 3, "note": "bring sb into conflict with…：使與…衝突"}, "4": {"ans": 0, "note": "have + 受詞 + 原形動詞（使役）"}, "5": {"ans": 2, "note": "為人類文明「奠定基礎」"}}, "opts": {"1": ["forbade", "enabled", "captured", "established"], "2": ["element", "skill", "distribution", "rank"], "3": ["adjustment", "balance", "banishment", "conflict"], "4": ["feed on", "to feed on", "fed on", "to have fed on"], "5": ["got along with", "made use of", "set the stage for", "come down with"]}}, {"t": "cloze", "school": "建中", "html": ["The race of humans existed in a primitive state. They were weak, and lacked the tools to survive. Zeus, however, intended to <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-g\" data-for=\"1\">them uncivilized</span> and refused to help. Prometheus felt sympathy for their struggle. He believed fire <span class=\"mk mk-g\" data-for=\"2\">would be</span> <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> to humankind and <span class=\"mk mk-k\" data-for=\"2\">decided to steal fire</span> from Zeus. <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button>, the king of the Olympian gods gave the Titan a <span class=\"mk mk-k\" data-for=\"3\">cruel and eternal punishment</span>. Prometheus was chained to a rock on Mount Caucasus, where an eagle would descend daily to eat up his ever- regenerating liver. Even in the face of such torture, Prometheus did not regret helping humankind. His willingness to suffer <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> humans makes him a symbol of <span class=\"mk mk-k\" data-for=\"4\">selfless courage</span>.", "Fire <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-g\" data-for=\"5\">humans to cook food</span>, forge tools, and defend themselves against the enemies of the natural world. It also symbolizes the spark of creativity and the pursuit of knowledge. <span class=\"mk mk-g\" data-for=\"6\">Without fire,</span> humans <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> the ability to learn, explore, and create art, science, and philosophy."], "blanks": {"1": {"ans": 2, "note": "keep + 受詞 + adj.：使保持（不開化）"}, "2": {"ans": 0, "note": "of + 名詞 = 形容詞；火對人類大有幫助，所以決定偷火"}, "3": {"ans": 2, "note": "冷酷永恆的懲罰 →「出於憤怒」"}, "4": {"ans": 3, "note": "願意「為了人類」受苦 → 無私的勇氣"}, "5": {"ans": 1, "note": "empower + 受詞 + to V：使能夠"}, "6": {"ans": 3, "note": "Without fire, 與現在事實相反的假設 → would + 原形"}}, "opts": {"1": ["maintain", "remain", "keep", "let"], "2": ["of great assistance", "in common use", "at all costs", "out of fashion"], "3": ["By accident", "In misery", "Out of rage", "By instinct"], "4": ["in charge of", "with the aim of", "in conflict with", "for the benefit of"], "5": ["engages", "empowers", "embraces", "persuades"], "6": ["will not have had", "had lost", "should have lost", "would lose"]}}, {"t": "cloze", "school": "南湖", "html": ["The gods and Titans of ancient Greece are still remembered today. One of the most famous is Prometheus, a Titan who deeply cared for humans. In Greek mythology, every living creature could receive a special gift from the gods; however, <span class=\"mk mk-g\" data-for=\"1\">by the time humans were ready</span> to be given theirs, all the good ones <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button>. Kind and soft-hearted, Prometheus could not <span class=\"mk mk-g\" data-for=\"2\">bear to see humans</span> <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> helplessly, so he chose to help. He taught them to walk upright and even stole fire from heaven so they could stay warm and cook food. Unfortunately, his attempts did not please everyone. Zeus, the king of the gods, was <span class=\"mk mk-k\" data-for=\"3\">madly angry</span>. He, <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button>, had Prometheus chained to a rock forever and sent an eagle to eat his liver each day.", "With Prometheus’ love for humankind, people, <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> being smaller, weaker, and slower than many animals, <span class=\"mk mk-k\" data-for=\"4\">managed to survive</span>."], "blanks": {"1": {"ans": 3, "note": "by the time + 過去式；禮物「被拿走」得更早 → 過去完成被動"}, "2": {"ans": 0, "note": "see + 受詞 + 原形動詞（感官動詞）"}, "3": {"ans": 2, "note": "宙斯非常生氣 →「因此」懲罰"}, "4": {"ans": 1, "note": "比動物弱小「儘管如此」仍活下來 → despite + V-ing"}}, "opts": {"1": ["have taken", "had taken", "have been taken", "had been taken"], "2": ["suffer", "suffered", "to suffer", "in suffering"], "3": ["in contrast", "after all", "as a result", "in other words"], "4": ["for", "despite", "instead of", "because of"]}}, {"t": "cloze", "school": "成淵", "html": ["Prometheus, a Titan, deeply loved humankind and sought to aid their survival. At Mecone, humans and Olympian gods met to decide on the distribution of sacrifices. There were <span class=\"mk mk-k\" data-for=\"1\">two offerings</span> presented. <span class=\"mk mk-g\" data-for=\"1\">One was beef</span> hidden inside a bull’s stomach and <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> was bones with shiny fat. <span class=\"mk mk-g\" data-for=\"2\">By the time Zeus found</span> what he chose was bones, he knew he <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> by Prometheus. Angry about being deceived, Zeus punished humans by removing fire, forcing them to live in misery—<span class=\"mk mk-g\" data-for=\"3\">starving, freezing, and</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> wild beasts.", "Out of compassion, Prometheus stole fire by hiding it in a hollow fennel stalk and secretly delivered it to humans. This gift enabled them to create tools, weapons, and protect themselves. <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> this theft, Zeus <span class=\"mk mk-k\" data-for=\"4\">punished Prometheus</span> by chaining him to a rock in the distant east, where an eagle repeatedly gnawed at his liver as eternal torment. <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> his endless suffering, Prometheus’s love for humans <span class=\"mk mk-k\" data-for=\"5\">earned him the title</span> “Champion of Humankind.” His myth symbolizes sacrifice, fight against a cruel and unfair king, and the origins of civilization."], "blanks": {"1": {"ans": 2, "note": "兩份祭品：One… the other…"}, "2": {"ans": 1, "note": "By the time 過去時間點；被騙發生更早且是被動 → had been tricked"}, "3": {"ans": 0, "note": "和 starving、freezing 並列的 V-ing；成為野獸的獵物"}, "4": {"ans": 3, "note": "對偷火「很憤怒」→ 懲罰 Prometheus"}, "5": {"ans": 3, "note": "無盡痛苦「儘管如此」仍贏得稱號 → Despite"}}, "opts": {"1": ["other offerings", "another", "the other", "still another"], "2": ["should be tricked", "had been tricked", "will have been tricked", "has been tricked"], "3": ["falling victim to", "standing up for", "making peace with", "running out of"], "4": ["Vulnerable to", "Credited with", "Advocating for", "Furious at"], "5": ["Except for", "Upon", "Without", "Despite"]}}, {"t": "cloze", "school": "永平", "html": ["In an age when powerful gods ruled, the Titan Prometheus made humans out of clay. By the time his brother Epimetheus took on the task of caring for humans, he had already given away all the gifts. To help humans, who were weak, <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> gave them the ability to walk like the gods, <span class=\"mk mk-c\" data-for=\"1\">but he also</span> kindly provided them fire for warmth, cooking, and making tools. With this gift, people could start to invent and build, <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-k\" data-for=\"2\">future things that would change</span> their lives. Prometheus’s love for humans soon caused a fight with Zeus, the king of the gods. During a meeting in Mecone to decide sacrifices, Prometheus tricked Zeus <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">giving two choices</span>: one part of good meat hidden in an ox’s stomach, and the other part that was only bones with fat. Zeus, tricked by its appearance, made the wrong choice, so <span class=\"mk mk-g\" data-for=\"4\">one part went to humans</span>, while <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> was left for the gods.", "Zeus, very angry at the trick, punished humans by <span class=\"mk mk-k\" data-for=\"5\">taking away fire</span>. <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button>, humans were <span class=\"mk mk-k\" data-for=\"5\">left cold and hungry</span>. <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> the pain of humans, <span class=\"mk mk-g\" data-for=\"6\">Prometheus could not just watch</span> and decided to help. He took fire from the sky and gave it back to humans. To punish him, Zeus <span class=\"mk mk-g\" data-for=\"7\">tied Prometheus to a rock,</span> <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> an eagle came every day to eat his liver, which kept growing back. Through this endless pain, Prometheus became known as the “Champion of Humans,” remembered for his strong sacrifice and love for human progress."], "blanks": {"1": {"ans": 0, "note": "後面有 but he also，是 not only…but also；不在句首所以不倒裝"}, "2": {"ans": 2, "note": "為將來改變生活的事物「奠定基礎」"}, "3": {"ans": 1, "note": "by + V-ing：藉由給兩個選擇來騙他"}, "4": {"ans": 2, "note": "one part… the other：兩份中的另一份"}, "5": {"ans": 0, "note": "沒有火 → 又冷又餓；選項要跟 taking away fire 呼應"}, "6": {"ans": 3, "note": "主詞 Prometheus 主動「看到」→ Seeing"}, "7": {"ans": 1, "note": "a rock, where + 完整句"}}, "opts": {"1": ["Prometheus not only", "not only Prometheus did", "Prometheus did not only", "not only did Prometheus"], "2": ["leading to", "ending up with", "setting the stage for", "feeding on"], "3": ["into", "by", "with", "for"], "4": ["still the other", "others", "the other", "another"], "5": ["Unable to use fire to create tools or weapons", "Capable of cooking and keeping warm with fire", "Not permitted to create art or crafts with fire", "Able to cook food and keep warm with fire"], "6": ["Being seen", "To see", "Seen", "Seeing"], "7": ["what", "where", "which", "there"]}}, {"t": "cloze", "school": "市大同", "html": ["Similarly, Prometheus the Titan chose to show his love by making bold decisions. He enabled human beings to <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> like the gods. He made them able to keep meat for themselves by tricking Zeus into choosing bones <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-k\" data-for=\"2\">in shining fat</span>. He even stole fire back from the sun to humans, <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> the sight of them starving and freezing <span class=\"mk mk-k\" data-for=\"3\">pained him so much</span>. In other words, Prometheus didn’t care if he would be caught <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">the king of the Olympian gods</span>. <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button>, he <span class=\"mk mk-k\" data-for=\"5\">cared more about</span> whether humans could <span class=\"mk mk-k\" data-for=\"1\">walk with dignity</span>, enjoy meat, and thrive by using fire as a powerful tool. Even though the price he had to pay was extremely high, he just fearlessly accepted the cruel punishment of being chained to a rock with an eagle gnawing at his liver every day. <span class=\"mk mk-k\" data-for=\"6\">Courageous and affectionate</span>, Prometheus truly <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> being the champion of humankind."], "blanks": {"1": {"ans": 0, "note": "像神一樣「直立站著」→ 呼應後面 walk with dignity"}, "2": {"ans": 0, "note": "bones covered in fat：被覆蓋 → 過去分詞"}, "3": {"ans": 2, "note": "for + 子句 = 因為（看到人類受苦讓他很痛苦）"}, "4": {"ans": 3, "note": "被抓的原因：「違抗」宙斯"}, "5": {"ans": 1, "note": "不在乎被抓 →「反而」更在乎人類"}, "6": {"ans": 3, "note": "勇敢又深情 → 名副其實 live up to"}}, "opts": {"1": ["stand upright", "make sacrifices", "explore and experiment", "figure out"], "2": ["covered", "covering", "cover", "to cover"], "3": ["which", "whose", "for", "until"], "4": ["fell victim to", "setting the stage for", "made a difference to", "going against"], "5": ["Above average", "Instead", "As a result", "Besides"], "6": ["got down to", "received much feedback from", "came into contact with", "lived up to his name of"]}}, {"t": "cloze", "school": "中山", "html": ["In the early days of the world, people did not know how to create fire, as it was a gift from the gods. People had to carefully tend to the glowing embers in their homes, never allowing them to die out completely, <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-k\" data-for=\"1\">they could cook and keep warm</span>. Māui, a mischievous half-god, had wanted to find out where fire actually came from. One night, he secretly put out all the embers in the village. The next morning, the village woke up and was shocked to see all the embers had turned to cold ashes. <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button>, everyone was <span class=\"mk mk-k\" data-for=\"2\">filled with great anger</span>. Māui’s reckless act <span class=\"mk mk-g\" data-for=\"3\">brought him into</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">with the villagers</span>, who demanded he seek out Mahuika, the fire goddess, to get fire. Otherwise, he would be <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">from the village and never allowed to return</span>.", "When Māui reached Mahuika’s cave, he begged her desperately, saying how his people would suffer without fire. Out of sympathy, Mahuika gave him one burning fingernail. Māui accepted it, but a devious idea was already forming. He tossed the flame into a river and returned for more, each time with a different excuse. <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> Mahuika realized she had been deceived, <span class=\"mk mk-g\" data-for=\"5\">she had lost</span> all but one fiery toenail. <span class=\"mk mk-k\" data-for=\"6\">Stomping her foot</span> <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button>, she threw the burning toenail at Māui. The tiny flame <span class=\"mk mk-g\" data-for=\"7\">exploded into a huge fire,</span> <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> forced Māui to turn into a hawk and flee into the sky.", "From above, Māui saw the last flame falling into a kaikōmako tree. At that moment, he realized fire was hidden inside the wood. He tried different ways to release it. Finally, by rubbing a branch against the tree, he made a spark. Thanks to him, people were <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> <span class=\"mk mk-k\" data-for=\"8\">the knowledge to create fire</span> from that day on. They no longer feared the cold."], "blanks": {"1": {"ans": 3, "note": "小心顧火，「以便」能煮食取暖 → so that 表目的"}, "2": {"ans": 1, "note": "火全熄 →「不出所料」大家都很生氣"}, "3": {"ans": 0, "note": "bring sb into conflict with"}, "4": {"ans": 1, "note": "否則會被「逐出」村子、永遠不能回來"}, "5": {"ans": 2, "note": "主要子句 had lost 是過去完成式 → By the time"}, "6": {"ans": 3, "note": "氣得跺腳 →「盛怒之下」"}, "7": {"ans": 0, "note": "逗號後接子句當主詞、修飾前面的大火 → which"}, "8": {"ans": 1, "note": "be equipped with + 知識：具備…"}}, "opts": {"1": ["in case", "while", "unless", "so that"], "2": ["In addition", "As expected", "On the other hand", "By doing so"], "3": ["conflict", "element", "tragedy", "instinct"], "4": ["punished", "banished", "overlooked", "criticized"], "5": ["As soon as", "Ever since", "By the time", "Long after"], "6": ["at risk", "in charge", "on duty", "in fury"], "7": ["which", "what", "it", "and"], "8": ["protected from", "equipped with", "distributed to", "figured out"]}}, {"t": "bank", "school": "淡江", "html": ["The discovery of fire <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-k\" data-for=\"1\">human civilization</span>. <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> modern humans evolved, <span class=\"mk mk-g\" data-for=\"2\">fire had been used</span> as a major tool by early humans. It provided warmth, and thus humans wouldn’t <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> on <span class=\"mk mk-k\" data-for=\"3\">cold nights</span> or during winters. But more importantly, it served as a source of light <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> human activity could <span class=\"mk mk-k\" data-for=\"4\">continue in the dark</span>. Without it, humans would have been <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-g\" data-for=\"5\">to their climate</span> and surroundings. <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> <span class=\"mk mk-g\" data-for=\"6\">to make weapons</span> and cook food, they had to live in caves and often <span class=\"mk mk-g\" data-for=\"7\">began to starve and</span> <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> the wild beasts. Fire could be made almost any place, helping humankind move into those areas they could not have gone. Moreover, <span class=\"mk mk-g\" data-for=\"8\">at a time</span> <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> humans did not know about bacteria, cooking meat helped prevent human from serious illnesses. The use of fire and smoke also <button class=\"pb\" data-n=\"9\" data-part=\"0\">(9)</button> <span class=\"mk mk-g\" data-for=\"9\">people to save</span> extra dried meat for later. Lastly, fire came to be an important form of protection since it could scare off wild beasts or enemies. Believing it to be a sign of danger, some groups of people would avoid it. <button class=\"pb\" data-n=\"10\" data-part=\"0\">(10)</button>, fire is <span class=\"mk mk-k\" data-for=\"10\">the most incredible achievement</span> in human history."], "blanks": {"1": {"ans": 5, "note": "火的發現「奠定」文明的基礎"}, "2": {"ans": 3, "note": "主要子句 had been used 是過去完成式 → by the time"}, "3": {"ans": 6, "note": "wouldn't + 原形動詞；寒冷的夜晚 → 凍僵"}, "4": {"ans": 1, "note": "「以便」人類在黑暗中活動 → so that"}, "5": {"ans": 2, "note": "would have been + 過去分詞 + to → 被限制在"}, "6": {"ans": 9, "note": "(Being) unable to V：分詞構句，無法做武器"}, "7": {"ans": 0, "note": "和 starve 並列的原形動詞片語 → 成為獵物"}, "8": {"ans": 4, "note": "at a time when：在…的年代"}, "9": {"ans": 7, "note": "enable + 受詞 + to V"}, "10": {"ans": 8, "note": "最後總結 →「因此」是最驚人的成就"}}, "bank": [["A", "fall victim to"], ["B", "so that"], ["C", "confined"], ["D", "by the time"], ["E", "when"], ["AB", "set the stage for"], ["AC", "freeze"], ["AD", "enabled"], ["AE", "as a result"], ["BC", "unable"]]}, {"t": "bank", "school": "松山", "html": ["In the beginning of time, the world belonged to the ancient Titans. These giant gods lived peacefully in their mountain homes, ruling over nature and mankind. Cronus was their king, and under his leadership, everything seemed <span class=\"mk mk-g\" data-for=\"1\">calm and</span> <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button>. The Titans believed their golden age would last forever. But beneath this quiet surface, trouble was growing. Young Zeus and his brothers were <span class=\"mk mk-k\" data-for=\"2\">secretly gathering</span> strength in <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> places. They were tired of living under Titan rule and wanted freedom. Soon, this peaceful world would face its greatest challenge.", "When Zeus finally revealed himself, the great <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> began immediately. Thunder crashed across the sky as the young gods <span class=\"mk mk-k\" data-for=\"3\">attacked their enemies</span>. The Titans <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">with terrible anger</span>, shaking the earth with their massive fists. Mountains crumbled and oceans boiled during these epic battles. Both sides <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-k\" data-for=\"5\">their hatred</span> and desire for victory. The war lasted for ten long years, with neither side <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> <span class=\"mk mk-g\" data-for=\"6\">to surrender</span>. During these long battles, gods fell from the heavens like falling stars, and the world trembled under their rage.", "At last, Zeus and his brothers <span class=\"mk mk-k\" data-for=\"7\">won the battles</span> and overthrew the titans. The <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> Titans were miserable as they realized their ancient power was gone forever. Most of them were <span class=\"mk mk-k\" data-for=\"8\">chained and thrown</span> into Tartarus, a dark prison deep beneath the earth. Only a few Titans escaped this terrible <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button>. In contrast, the fruits of success belonged entirely to the young Olympian gods, who now controlled everything. Among them, Zeus became the new king of all gods and divided the world among his brothers and sisters.", "The battles changed the world of gods forever. The <button class=\"pb\" data-n=\"9\" data-part=\"0\">(9)</button> marked <span class=\"mk mk-k\" data-for=\"9\">the end of the old age</span> and the beginning of something completely new. The fierce battles had destroyed much of the ancient world, but they also cleared the way for progress. Different from the Titan gods, the Olympians brought new ideas about how to rule <button class=\"pb\" data-n=\"10\" data-part=\"0\">(10)</button> <span class=\"mk mk-k\" data-for=\"10\">and nature</span>. Under their leadership, heroes would rise and civilizations would thrive. The memory of the battles would live on in stories told by humans for thousands of years to come."], "blanks": {"1": {"ans": 6, "note": "calm and + 形容詞：平靜而有秩序"}, "2": {"ans": 2, "note": "secretly 暗中 → 隱密的地方（形容詞 + places）"}, "3": {"ans": 3, "note": "the great + 名詞；雷聲大作、開打 → 衝突"}, "4": {"ans": 9, "note": "泰坦帶著怒火「反擊」"}, "5": {"ans": 8, "note": "雙方被仇恨「驅使」→ feed on"}, "6": {"ans": 0, "note": "neither side willing to surrender：都不願投降"}, "7": {"ans": 7, "note": "宙斯贏了 →「戰敗的」泰坦"}, "8": {"ans": 5, "note": "被鎖、丟進監獄 → 這可怕的懲罰"}, "9": {"ans": 4, "note": "The + 名詞 + marked the end：勝利"}, "10": {"ans": 1, "note": "rule ___ and nature：凡人"}}, "bank": [["A", "willing"], ["B", "mortals"], ["C", "hidden"], ["D", "conflict"], ["E", "victory"], ["AB", "punishment"], ["AC", "ordered"], ["AD", "defeated"], ["AE", "fed on"], ["BC", "fought back"]]}, {"t": "struct", "school": "北一", "html": ["At the mention of Greek mythology, many think about unusual tales of the gods and goddesses, wild beasts, and the crazy tasks of heroes. However, these myths aren’t just legends; they are stories with a purpose and reason. They were created to supply <span class=\"mk mk-k\" data-for=\"1\">valuable lessons</span> which remain true to this day. <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> Homer’s Odyssey shows us that greedy, irresponsible leadership makes communal life intolerable for everyone. By contrast, <span class=\"mk mk-k\" data-for=\"2\">good leaders respect their duties</span> to their people and ensure that their people are respecting them and their fellows. <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> The Odyssey encourages us to choose our leaders and role models carefully.", "The hero of Homer’s other epic, the Iliad, Achilles, was all-powerful <span class=\"mk mk-k\" data-for=\"3\">except in his heel</span>. <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> Our politicians would do well to <span class=\"mk mk-g\" data-for=\"3\">remember this</span>. On the opposing side in the Trojan War, Hector, the son of King Priam of Troy, is forced to fight Achilles and runs for his life, only to return later and fight the battle to the finish. This story illustrates the importance of facing our fears.", "<button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">Many businesses have adopted names</span> from Greek mythology because of the message behind them, such as Pandora and Hermes — the delivery brand taking its name from Hermes the messenger of the gods. They show how true and influential Greek mythology has been. The overall ideas and many of the stories have stood the test of time and continued to resonate with people across different cultures and eras."], "blanks": {"1": {"ans": 0, "note": "前面說神話有目的、有教訓 → 深入看能看到道德與哲學"}, "2": {"ans": 1, "note": "This 指「好領導者尊重責任」→ 帶來秩序和諧"}, "3": {"ans": 4, "note": "阿基里斯只有腳跟是弱點 → 教訓：每個人都有弱點；下一句 remember this 呼應"}, "4": {"ans": 3, "note": "新段第一句：身邊處處有提醒 → 下一句舉企業取名為例"}}, "sents": ["A deeper look at them reveals ancient Greek morals, philosophies and even warnings.", "This produces order, harmony, and happiness for everyone — powerful and weak alike.", "While many of these myths are fanciful tales, other stories have a basis in historical facts.", "There are constant subtle reminders all around us of Greek mythology, reminding us of their valuable lessons.", "The lesson to learn is that everyone has weaknesses, and that a small flaw can stop us from achieving our goals."]}, {"t": "read", "school": "麗山", "html": ["In Greek mythology, Zeus and Poseidon were brothers. Zeus was the God of the Sky while Poseidon was the God of the Sea. There are similarities between the two brothers, but there are also many differences, which is why they rarely got along.", "Zeus Zeus, King of the gods and supreme ruler of the sky, governed the heavens, including clouds, weather, and Mount Olympus. Known for his <span class=\"mk mk-k\" data-for=\"q0\">quick temper</span> and powerful nature, he <span class=\"mk mk-k\" data-for=\"q3\">set free thunderstorms when angered</span>, striking fear in both mortals and deities. <span class=\"mk mk-k\" data-for=\"q3\">Despite this wrath</span>, Zeus also performed heroic deeds, such as <span class=\"mk mk-k\" data-for=\"q2\">freeing his siblings</span> from their father Cronus’ stomach. His greatest symbol of power was the thunderbolt, <span class=\"mk mk-k\" data-for=\"q2\">forged by the Cyclopes</span>, which gave him unmatched control over the weather and supreme strength compared to his siblings. Renowned for <span class=\"mk mk-k\" data-for=\"q1\">leadership qualities that Poseidon lacked</span>, Zeus’s courage and decisive actions in defeating his father Cronus and the Titans established him as the destined ruler of all gods.", "Poseidon Poseidon, god of the seas, earthquakes, and horses, ruled mainly from his watery realm, though he was one of the great Olympian gods. He was worshipped by sailors as the protector of ships. <span class=\"mk mk-k\" data-for=\"q0\">His personality was moody</span> and unpredictable—friendly and helpful one day, but violent and destructive when angered. Unlike Zeus, his temper made less quickly, yet once provoked, he suddenly released earthquakes, tidal waves, and floods without concern for others. His weapon, the trident, <span class=\"mk mk-k\" data-for=\"q2\">gave him power over the seas and the Earth itself</span>, earning him the title “Earth Shaker.” Able to both calm and destructive, Poseidon was considered the second most powerful Olympian god after his brother Zeus."], "qs": [{"q": "The chart compares Zeus and Poseidon in terms of their domains, ______, and power.", "opts": ["*personalities", "weapons", "siblings", "sailors"], "multi": false, "ex": "兩段都在講個性：Zeus quick temper、Poseidon moody and unpredictable。和 domains、power 並列，要用複數名詞。"}, {"q": "In sum, Poseidon is a powerful god, but he lacks the same ______ qualities that Zeus has.", "opts": ["*leadership", "physical", "friendly", "destructive"], "multi": false, "ex": "原文 Renowned for leadership qualities that Poseidon lacked。"}, {"q": "Which ones are TRUE based on the information provided?", "opts": ["*Poseidon earned the title “earth shaker” because his trident could cause earthquakes.", "Zeus often stayed in the sea, protecting sailors and ships as his main duty.", "*Zeus’s thunderbolt, forged by the Cyclopes, symbolized his unmatched control over weather.", "Poseidon could cause storms to destroy ships but also calm the waters to help sailors.", "*Zeus was known for freeing his siblings from Cronus’ stomach, showing both courage and authority.", "Unlike his brother Zeus, Poseidon was known for his calm friendliness, rarely turning to violence or destruction."], "multi": true, "ex": "(B) 保護水手的是 Poseidon；(F) 與 violent and destructive 矛盾；(D) 解答未採用。"}, {"q": "The phrase “this wrath” in the first paragraph does NOT refer to ______.", "opts": ["*Zeus’s status as the ruler of the sky", "Zeus’s quick temper and vengeful nature", "Zeus setting free thunderstorms when angered", "Zeus striking fear in mortals and deities"], "multi": false, "ex": "this 指前一句的怒氣：脾氣暴躁、放雷暴、讓人害怕；統治天空的地位不是「怒氣」。"}]}]}, {"key": "PR1", "name": "R1 題本", "emoji": "🖨️", "lead": "3D Printing：3D 列印", "cards": [{"t": "cloze", "school": "附中", "html": ["Picture a printer capable of creating three-dimensional objects, such as artificial limbs, coral reefs, and even buildings. <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> many might have considered this a <span class=\"mk mk-k\" data-for=\"1\">ridiculous dream</span>, 3D printing is <span class=\"mk mk-k\" data-for=\"1\">already a reality</span>. The technology has already changed many people’s lives, as illustrated by Alex Pring, a boy born without most of his right arm. A team of engineering students took on the challenge of creating a prosthetic arm for him. This arm <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-g\" data-for=\"2\">a large degree</span> helped Alex engage in activities, from riding a bike to playing his favorite video games. <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-k\" data-for=\"3\">a sensor</span>, the arm allowed him to open and close his hand simply by flexing his muscles, offering him a new level of independence. <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> improving lives through prosthetics, 3D printing <span class=\"mk mk-c\" data-for=\"4\">is also helping</span> to protect ecosystems by creating artificial coral reefs to restore marine habitats. These reefs are designed to closely match natural reefs both in texture and in structure. The technology is also revolutionizing construction, as demonstrated by Dubai’s “Office of the Future.” It took a massive 3D printer just 17 days to <span class=\"mk mk-k\" data-for=\"5\">print the parts</span>, and took workers only two days to <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> them, significantly reducing labor and time. These examples show how 3D printing is providing innovative solutions across various fields."], "blanks": {"1": {"ans": 2, "note": "很多人覺得荒謬 vs. 已是現實 → 讓步 While（雖然）"}, "2": {"ans": 2, "note": "to a large degree：在很大程度上"}, "3": {"ans": 0, "note": "手臂「配備」感測器 → 被動分詞構句 Equipped with"}, "4": {"ans": 3, "note": "後面有 also：除了義肢「還」保護生態 → Aside from（累加）"}, "5": {"ans": 0, "note": "印好零件，工人再「組裝」"}}, "opts": {"1": ["Because", "If", "While", "After"], "2": ["for", "with", "to", "at"], "3": ["Equipped with", "Amazed by", "Keen on", "Aimed at"], "4": ["Because of", "Except for", "As opposed to", "Aside from"], "5": ["assemble", "fright", "promise", "freeze"]}}, {"t": "bank", "school": "中崙", "html": ["Imagine a printer that can create three-dimensional objects like <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-k\" data-for=\"1\">limbs</span>, coral reefs, and even buildings. One considered impossible, this concept turns into a reality thanks to 3D printing technology. For children with disabilities like Alex Pring, born without most of his right arm, 3D printing provides a solution. Engineering students designed a plastic electronic arm <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-g\" data-for=\"2\">with sensors</span>, allowing Alex to open and close his hand by flexing his biceps. This technology enables the production of countless useful objects, offering life-changing <span class=\"mk mk-g\" data-for=\"3\">benefits to</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button>.", "Another application is helping to solve the <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> of coral reefs <span class=\"mk mk-k\" data-for=\"4\">due to global warming</span>. A 3D- printed reef has been created in the Caribbean. These structures offer a <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-g\" data-for=\"5\">for sea creatures</span>, protecting precious species and saving marine ecosystem.", "3D printing is also revolutionizing construction. In Dubai, the “Office of the Future,” the world’s first fully 3D-printed office building, was completed in just 17 days by using a massive printer. It <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> labor costs <span class=\"mk mk-g\" data-for=\"6\">and saved</span> building time significantly. By 2030, Dubai plans for 25% of its new buildings to be built using this technology.", "Clearly, 3D printing holds great potential for improving lives and the environment."], "blanks": {"1": {"ans": 1, "note": "___ limbs 需要形容詞 → 人工的（義肢）"}, "2": {"ans": 0, "note": "arm equipped with sensors：配備…"}, "3": {"ans": 3, "note": "benefits to + 名詞 → 個人"}, "4": {"ans": 5, "note": "the + 名詞 + of coral reefs；全球暖化 → 消失"}, "5": {"ans": 2, "note": "a + 名詞 + for sea creatures → 棲地"}, "6": {"ans": 4, "note": "和 saved 並列的過去式動詞 → 減少"}}, "bank": [["A", "equipped"], ["B", "artificial"], ["C", "habitat"], ["D", "individuals"], ["E", "reduced"], ["AB", "disappearing"], ["AC", "assembled"], ["AD", "layers"]]}, {"t": "bank", "school": "建中", "html": ["The technology of 3D printing creates three-dimensional objects from digital files by layering materials such as plastics, metals, and even biological matter. It begins with a computer-aided design (CAD) model, sliced into <span class=\"mk mk-k\" data-for=\"1\">thin layers</span>, <span class=\"mk mk-g\" data-for=\"1\">which the printer</span> <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> until the product is complete. This method is really different from <span class=\"mk mk-g\" data-for=\"2\">traditional</span> <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button>, which usually cuts away material from a solid block, wasting a lot of resources.", "A major advantage is the ability to produce complex shapes difficult or impossible with conventional methods. In aerospace, for example, parts can include intricate internal structures that <span class=\"mk mk-g\" data-for=\"3\">reduce weight without</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> strength. This improves performance and saves fuel, a critical factor in aviation. And being able to tailor designs for specific needs lets manufacturers create products that <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">what customers want</span>, making them more competitive in a fast-changing market.", "<span class=\"mk mk-c\" data-for=\"5\">However, challenges remain.</span> Material <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> are a key concern. While options have expanded, many applications still demand properties current 3D printing materials cannot provide. In the automotive industry, for instance, parts must <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> <span class=\"mk mk-k\" data-for=\"6\">extreme heat and stress</span>, which today’s materials may not withstand. Researchers are therefore <span class=\"mk mk-g\" data-for=\"7\">working to</span> <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> existing materials to make them stronger and more versatile, helping broaden 3D printing’s applications.", "3D printing also <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> <span class=\"mk mk-g\" data-for=\"8\">to be useful</span> for supply chains. Traditional production methods <button class=\"pb\" data-n=\"9\" data-part=\"0\">(9)</button> <span class=\"mk mk-k\" data-for=\"9\">vast supplier networks</span> and logistics, but 3D printing allows production on-site or closer to customers. This reduces transportation costs and makes delivery faster and more efficient. Yet such a change raises concerns about the future of large factories and traditional jobs. As the need for large factories decreases, the <span class=\"mk mk-k\" data-for=\"10\">economic and employment</span> <button class=\"pb\" data-n=\"10\" data-part=\"0\">(10)</button> will be significant and deserve careful attention."], "blanks": {"1": {"ans": 7, "note": "which the printer + 單數動詞；把薄層「逐層堆疊」"}, "2": {"ans": 0, "note": "traditional + 名詞 → 製造業"}, "3": {"ans": 1, "note": "without + V-ing：減重但不犧牲強度"}, "4": {"ans": 9, "note": "products that + 複數動詞；符合顧客需求"}, "5": {"ans": 2, "note": "challenges remain → 材料的「限制」（複數名詞 + are）"}, "6": {"ans": 5, "note": "must + 原形；承受極端高溫"}, "7": {"ans": 4, "note": "working to + 原形；調整現有材料"}, "8": {"ans": 8, "note": "promise to be useful：有望派上用場（單數主詞 + promises）"}, "9": {"ans": 6, "note": "傳統生產「依賴」龐大供應網"}, "10": {"ans": 3, "note": "economic and employment + 名詞 → 影響"}}, "bank": [["A", "manufacturing"], ["B", "sacrificing"], ["C", "limitations"], ["D", "impacts"], ["E", "adjust"], ["AB", "endure"], ["AC", "rely on"], ["AD", "builds up"], ["AE", "promises"], ["BC", "fit"]]}, {"t": "bank", "school": "成功", "html": ["3D printing has turned ideas once considered science fiction into everyday reality. Artificial limbs, for instance, can now be produced quickly at a low cost. A young boy in the US was given a plastic electronic arm <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> <span class=\"mk mk-g\" data-for=\"1\">with a special sensor</span>. This amazing design <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-g\" data-for=\"2\">him to open</span> and close his hand simply by flexing a muscle. It thus allowed him to play, hold objects, and even hug his parents with both arms. Such progress shows how technology can improve lives in ways <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">people once thought impossible</span>.", "The oceans are also experiencing new hope. Coral reefs are vanishing rapidly <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">rising global temperatures</span> and pollution. To address this problem, scientists have begun using 3D printers to design reefs that imitate natural ones in both <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-g\" data-for=\"5\">and structure</span>. These artificial creations provide a safe <button class=\"pb\" data-n=\"6\" data-part=\"0\">(6)</button> <span class=\"mk mk-k\" data-for=\"6\">for fish, crabs</span>, and many other species. If they remain successful in attracting marine life, underwater ecosystems may be preserved and thrive.", "Building design is another area where creativity has advanced rapidly. In Dubai, experts produced the pioneering “Office of the Future.” It <button class=\"pb\" data-n=\"7\" data-part=\"0\">(7)</button> <span class=\"mk mk-g\" data-for=\"7\">only seventeen days to print</span> all the parts in concrete and just two days to put them together. <button class=\"pb\" data-n=\"8\" data-part=\"0\">(8)</button> <span class=\"mk mk-k\" data-for=\"8\">official reports</span>, this process required half the labor and used less material. Moreover, it was completed in a <button class=\"pb\" data-n=\"9\" data-part=\"0\">(9)</button> <span class=\"mk mk-g\" data-for=\"9\">short time compared with</span> traditional building methods. This project is sure to motivate plans for more 3D-printed construction in the future. <button class=\"pb\" data-n=\"10\" data-part=\"0\">(10)</button>, this technology <span class=\"mk mk-k\" data-for=\"10\">holds enormous potential</span>. By investing in creative research, we may use 3D printing to reduce costs, protect ecosystems, and build sustainable cities that serve both people and the planet."], "blanks": {"1": {"ans": 7, "note": "arm equipped with…：配備"}, "2": {"ans": 1, "note": "enable + 受詞 + to V"}, "3": {"ans": 5, "note": "in ways that people once thought impossible：that 當 thought 的受詞"}, "4": {"ans": 2, "note": "「因為」氣溫上升 → due to + 名詞"}, "5": {"ans": 10, "note": "both ___ and structure：兩個名詞並列 → 質地"}, "6": {"ans": 3, "note": "a safe + 名詞 + for fish → 棲地"}, "7": {"ans": 6, "note": "It took + 時間 + to V：花了…時間"}, "8": {"ans": 9, "note": "「根據」官方報告"}, "9": {"ans": 11, "note": "副詞修飾 short → 相對較短"}, "10": {"ans": 4, "note": "最後總結 →「毫無疑問」潛力巨大"}}, "bank": [["A", "spent"], ["B", "enabled"], ["C", "due to"], ["D", "habitat"], ["E", "undoubtedly"], ["AB", "that"], ["AC", "took"], ["AD", "equipped"], ["AE", "which"], ["BC", "according to"], ["BD", "texture"], ["BE", "relatively"]]}, {"t": "bank", "school": "中崙", "html": ["Imagine a printer that can create three-dimensional objects—artificial limbs, coral reefs, even buildings. Once thought <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button>, this idea is <span class=\"mk mk-k\" data-for=\"1\">now reality</span> with 3D printing. Using computer designs and layers of material, the technology can reduce labor and time in construction. In 2016, Dubai introduced the “Office of the Future,” the first 3D-printed office. A massive printer produced all the <button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> <span class=\"mk mk-g\" data-for=\"2\">parts in just</span> seventeen days, and workers took only two days to assemble them.", "3D printing has also transformed lives. In Florida, a boy born without most of his right arm received an artificial limb from university students, which allowed him to hug his parents. The technology is also helping to <span class=\"mk mk-k\" data-for=\"3\">protect marine</span> <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button>. Projects in the Caribbean now create artificial coral reefs, restoring the <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> <span class=\"mk mk-k\" data-for=\"4\">of ecosystems</span>. Clearly, 3D printing helps both people and the planet. To move forward, we must <button class=\"pb\" data-n=\"5\" data-part=\"0\">(5)</button> <span class=\"mk mk-g\" data-for=\"5\">a blueprint</span> for its future."], "blanks": {"1": {"ans": 4, "note": "Once thought + adj.，對比 now reality → 荒謬的"}, "2": {"ans": 2, "note": "all the ___ parts：形容詞 → 各個零件"}, "3": {"ans": 1, "note": "protect marine + 複數名詞 → 棲地"}, "4": {"ans": 5, "note": "restore the balance of ecosystems：恢復生態平衡"}, "5": {"ans": 6, "note": "make out a blueprint：擬定藍圖"}}, "bank": [["A", "texture"], ["B", "habitats"], ["C", "individual"], ["D", "promised"], ["E", "ridiculous"], ["AB", "balance"], ["AC", "make out"], ["AD", "make up for"]]}, {"t": "struct", "school": "明倫", "html": ["The wheel is one of humanity’s greatest inventions. It has helped improve technology, transportation, and industry for thousands of years and still does today. The history of the wheel began around 4500 BC in Mesopotamia, where the Sumerians first used it as a <span class=\"mk mk-k\" data-for=\"1\">pottery-making tool</span>. <button class=\"pb\" data-n=\"1\" data-part=\"0\">(1)</button> Centuries later, the Sumerians used the wheel for transport. By 2200 BC, the Sintashta people of the Ural Mountains likely invented spoked wheels, which made chariots faster and easier to steer in battle.", "<button class=\"pb\" data-n=\"2\" data-part=\"0\">(2)</button> Around AD 100, <span class=\"mk mk-k\" data-for=\"2\">the Chinese invented</span> the wheelbarrow to help with farming and construction. In Europe, the Romans added iron rings to wheels for durability, which was useful on their vast road network. <button class=\"pb\" data-n=\"3\" data-part=\"0\">(3)</button> <span class=\"mk mk-g\" data-for=\"3\">They are essential parts</span> of bicycles, cars, trains, and airplanes. Pneumatic tires, filled with compressed air, were introduced in the late 1800s and provide smoother rides and better traction. Wheels continue to develop. New airless and self-repairing tires, like Michelin’s 3D-printed Uptis, aim to prevent flat tires. <button class=\"pb\" data-n=\"4\" data-part=\"0\">(4)</button> From ancient carts to <span class=\"mk mk-k\" data-for=\"4\">space missions</span>, the wheel has always helped move civilization forward."], "blanks": {"1": {"ans": 1, "note": "前一句講陶輪 → This early wheel 幫陶工"}, "2": {"ans": 3, "note": "新段第一句；後面舉中國、羅馬 → 其他社會也採用"}, "3": {"ans": 4, "note": "接著講腳踏車、汽車 → They 指 wheels，今天用於交通"}, "4": {"ans": 0, "note": "輪子持續發展 → NASA 火星車 → 呼應 space missions"}}, "sents": ["NASA is also designing special wheels for rovers to use on Mars.", "This early wheel helped potters spin clay more easily and make better pots.", "Early wheels spun in the opposite direction of where people wanted to go.", "Other societies also adopted the wheel.", "Today, wheels are most common in transportation."]}, {"t": "read", "school": "西松", "html": ["Interviewer: 3D printing looks exciting in the classroom—motors whir, layers appear, ideas become objects. Yet two concerns keep coming up: intellectual property and weaponization. To set the stage: why must learners face these directly?", "Expert: Well, as is known to everyone, the technology is powerful and widely available. Without clear guidance, students can copy designs unlawfully or produce unsafe items.", "Interviewer: Then let me press you on intellectual property. A student, say, finds a “free” phone- stand file online. He plans to remix it and sell a few at a school fair. Many would say, “It’s on the internet, so it’s fine.” Is it?", "Expert: Not necessarily. Licenses such as Creative Commons or commercial terms define what we may download, modify, share, or sell. Good practice is simple: <span class=\"mk mk-k\" data-for=\"q3\">check the license</span>, <span class=\"mk mk-k\" data-for=\"q0\">credit the designer exactly as required</span>, and <span class=\"mk mk-k\" data-for=\"q3\">avoid files that lack permission</span>. This protects creators—and students—from legal and quality problems.", "Interviewer: And a follow-up: What do you suggest that teachers put on the classroom wall? Expert: “Before you print, read the license; before you post, cite the source.”", "Interviewer: That’s a helpful piece of advice. Then what about weaponization and public safety. 3D printers can make helpful tools, and, of course, prohibited parts. How do educators talk about this without causing unnecessary fear?", "Expert: In this scenario, I would frame it as a matter of <span class=\"mk mk-k\" data-for=\"q2\">dual-use ethics</span>. When people use science or technology that could be misused, they should respect human rights, follow the law, and prevent harm. The goal is to help people, not hurt them. So educators should post clear classroom rules aligned with local laws, monitor project proposals, and <span class=\"mk mk-k\" data-for=\"q1\">reject restricted designs</span>. Most importantly, ask students to explain the social benefit of their project and document how it will be used safely.", "Interviewer: If a learner submits a borderline design, what should a teacher do?", "Expert: Pause the print, review policies with the student, and redirect toward a community-positive alternative.", "Interviewer: Lastly, give us a quick checklist—two rules for a responsible lab.", "Expert: Sure thing! They’re, first of all, license first, credit always, and design for safety and social value.", "Interviewer: Concise and actionable. So the message is “print wisely”—with respect for creators, and compliance with safety laws.", "Expert: Exactly. That balance turns impressive machines into genuinely educational tools."], "qs": [{"q": "On intellectual property, good practices such as checking licenses and ______ the designers can never be overemphasized.", "opts": ["*crediting", "checking", "copying", "printing"], "multi": false, "ex": "and 前是 checking（V-ing），並列也要 V-ing；原文 credit the designer。"}, {"q": "On weaponization, schools must reject ______ designs, follow laws, and teach ethical purposes.", "opts": ["*restricted", "borderline", "helpful", "free"], "multi": false, "ex": "原文 reject restricted designs。borderline 設計是暫停、引導，不是直接拒絕。"}, {"q": "Which phrase refers to the principle that the same technology can be used for benefit or for harm?", "opts": ["*dual-use ethics", "intellectual property", "social value", "public safety"], "multi": false, "ex": "dual-use＝雙重用途，可能被濫用 → 使用者有責任預防傷害。"}, {"q": "Which scenarios follow the rule of respecting intellectual property?", "opts": ["A warning list was posted in the STEAM lab; staff check uploads and stop any banned parts.", "*The school uses an educational model pack for prints; students do not redistribute the files.", "*Jack printed a game controller stand and avoided logos, characters, or trademarks entirely.", "Kate printed tool adapters for artificial hands, then cleaned, tested, and donated them.", "Students designed earthquake whistle cases and shared them during drills."], "multi": true, "ex": "智慧財產權看授權與不侵權：(B) 照授權使用不再散布、(C) 避開商標角色。(A) 是安全規範，(D)(E) 是社會價值，不是智財權。"}]}]}];

let combo=0;
const comboEl=document.getElementById('combo');
function floatText(txt,x,y,big){
  const f=el('div','float'+(big?' big':''),txt);f.style.left=x+'px';f.style.top=y+'px';document.body.append(f);
  if(reduce){setTimeout(()=>f.remove(),700);return}
  f.animate([{opacity:0,transform:'translate(-50%,-30%) scale(.6)'},{opacity:1,transform:'translate(-50%,-90%) scale(1.1)',offset:.3},{opacity:0,transform:'translate(-50%,-220%) scale(1)'}],{duration:big?1300:900,easing:'ease-out'}).onfinish=()=>f.remove();
}
function confetti(x,y,n=22,spread=1){
  if(reduce)return;
  for(let i=0;i<n;i++){
    const c=el('div','cf');c.style.left=x+'px';c.style.top=y+'px';c.style.background=COLORS[i%COLORS.length];
    if(i%3===0){c.style.borderRadius='50%';c.style.width=c.style.height='9px'}
    document.body.append(c);
    const a=Math.random()*Math.PI*2, v=(70+Math.random()*120)*spread;
    const dx=Math.cos(a)*v, dy=Math.sin(a)*v-80*spread;
    c.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*540}deg)`,opacity:1,offset:.6},{transform:`translate(${dx*1.2}px,${dy+160}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1100+Math.random()*500,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>c.remove();
  }
}
function right(node,e){

  updateStats();checkAch();
}

}
