  if(S.ach.has(id))return;S.ach.add(id);save();
  const a=ACH.find(a=>a.id===id);toast(a.e,'解鎖成就：'+a.n,a.d);updateStats();
}
const doneOf=t=>ALL.filter(c=>c.t===t&&S.done.has(c.id)).length;
function checkAch(){
  if(S.done.size>=1)unlock('first');
  if(combo>=5)unlock('c5');if(combo>=10)unlock('c10');if(combo>=20)unlock('c20');
  if(doneOf('build')>=5)unlock('b5');
  if(doneOf('cloze')>=10)unlock('cloze10');
  if(doneOf('bank')>=3)unlock('bank3');
  if(doneOf('read')>=4)unlock('reader');
  if(S.done.size>=ALL.length/2)unlock('half');
  SECS.forEach(s=>{if(s.cards.every(c=>S.done.has(c.id)))unlock('s-'+s.key)});
  const mc=DATA.find(s=>s.key==='MC').cards;
  if(mc.every(c=>S.done.has(c.id))&&mc.every(c=>!S.miss.has(c.id)))unlock('perfect');
  if(S.done.size===ALL.length)unlock('all');
}
function updateStats(){
  const pct=Math.round(S.done.size/ALL.length*100);
  document.getElementById('count').textContent=S.done.size;
  document.getElementById('total').textContent='/ '+ALL.length;
  document.getElementById('sun').style.setProperty('--p',pct);
  document.getElementById('level').textContent=LEVELS.filter(l=>pct>=l[0]).pop()[1];
  document.getElementById('pts').textContent='☀ 陽光值 '+S.pts;
  document.getElementById('achBtn').textContent=`🏅 成就 ${S.ach.size}/${ACH.length}`;
  SECS.forEach(s=>{
    const t=document.getElementById('tab-'+s.key);if(!t)return;
    const n=s.cards.filter(c=>S.done.has(c.id)).length;
    t.querySelector('small').textContent=`${n}/${s.cards.length}`;t.classList.toggle('full',n===s.cards.length);
  });
}
function complete(c,card,node,e){
  if(c.t!=='blanks'&&c.t!=='build'&&c.t!=='choice'&&c.t!=='mc'){}else showEx(card,c);
  if(S.done.has(c.id)){setDoneLook(card,c);return}
  S.done.add(c.id);save();setDoneLook(card,c);
  const[x,y]=pos(node,e);
  confetti(x,y,c.html?40:26,c.html?1.3:1);
  setTimeout(()=>floatText(PRAISE[Math.random()*PRAISE.length|0],x,y-40,true),120);
  anim(document.getElementById('sun'),'pulse');
  if(c.html&&c.t!=='read'&&!S.miss.has(c.id))unlock('clean');
  updateStats();checkAch();
  if(c.sec.cards.every(k=>S.done.has(k.id)))setTimeout(()=>celebrate(c.sec),900);
}
function celebrate(sec){
  const w=innerWidth,h=innerHeight;
  [[w*.25,h*.4],[w*.75,h*.4],[w*.5,h*.3]].forEach(([x,y],i)=>setTimeout(()=>confetti(x,y,40,1.5),i*220));
  const allDone=S.done.size===ALL.length;
  showModal(`<div class="bigE">${allDone?'☀️':sec.emoji}</div>
    <h2>${allDone?'全部點亮了！':sec.name+' 全部點亮！'}</h2>
    <p>${allDone?'你就是今天的小太陽，段考加油！':'目前陽光值 '+S.pts+'，繼續往下衝吧'}</p>
    <button class="btn" data-close>${allDone?'耶！':'繼續'}</button>`);
}
document.getElementById('achBtn').onclick=()=>{
  showModal(`<div class="bigE">🏅</div><h2>成就 ${S.ach.size} / ${ACH.length}</h2>
   <div class="achlist">${ACH.map(a=>`<div class="ach ${S.ach.has(a.id)?'':'lock'}"><span class="e">${a.e}</span><div><b>${a.n}</b><small>${a.d}</small></div></div>`).join('')}</div>
   <button class="btn" data-close>關閉</button>`);
};

/* ---------- 底部作答區 ---------- */
const dockEl=document.getElementById('dock'),dockLab=document.getElementById('dockLab'),dockNote=document.getElementById('dockNote'),dockOpts=document.getElementById('dockOpts');
let dockCur=null;
function setDockH(){document.documentElement.style.setProperty('--dockH',dockEl.classList.contains('show')?dockEl.offsetHeight+'px':'0px')}
function clearGlow(){document.querySelectorAll('.psg .glow').forEach(m=>m.classList.remove('glow'));document.querySelectorAll('.pb.active').forEach(b=>b.classList.remove('active'))}
const Dock={
  open(cfg){
    clearGlow();dockCur=cfg;
    cfg.marks.forEach(m=>m.classList.add('glow'));
    cfg.pbs.forEach(b=>b.classList.add('active'));
    dockLab.textContent=cfg.title;
    dockNote.innerHTML='💡 '+cfg.note+'<br><small style="color:var(--muted)">發亮的字就是這格的線索</small>';
    dockNote.classList.remove('show');
    dockOpts.innerHTML='';
    cfg.options.forEach((o,i)=>{
      const b=el('button','chip en'+(o.long?' long':''),esc(o.label));
      b.disabled=!!o.disabled;
      b.onclick=e=>cfg.pick(i,b,e);
      dockOpts.append(b);
    });
    dockEl.classList.add('show');document.body.classList.add('docked');
    requestAnimationFrame(setDockH);
  },
  close(){clearGlow();dockCur=null;dockEl.classList.remove('show');document.body.classList.remove('docked');setDockH()},
  hint(){dockNote.classList.add('show');setDockH()}
};
document.getElementById('hintBtn').onclick=()=>Dock.hint();
document.getElementById('dockClose').onclick=()=>Dock.close();
addEventListener('resize',setDockH);

/* ---------- 題卡 ---------- */
function showEx(card,c){const ex=card.querySelector('.ex');if(c.ex){ex.innerHTML=c.ex;ex.classList.add('show')}}
function setDoneLook(card,c){
  card.classList.add('done');
  const b=card.querySelector('.badge');b.innerHTML='☀ 已點亮';
  const again=el('button','again','再練一次');again.onclick=()=>{if(dockCur&&dockCur.card===card)Dock.close();card.replaceWith(makeCard(c,true))};
  b.append(again);
}
const KIND={learn:'小教室',blanks:'點選填空',build:'排句子',choice:'點選',mc:'選擇題',cloze:'克漏字',bank:'文意選填',struct:'篇章結構',read:'閱讀測驗'};

function makeCard(c,fresh){
  const card=el('article','card');card.dataset.id=c.id;
  const head=el('div','card-head');
  let title=c.t==='mc'?'第 '+c.num+' 題':(c.html?`（${c.school}）`:c.title);
  head.append(el('h3','',`<span class="kind">${KIND[c.t]}</span>${title}`),el('span','badge','還沒點亮'));
  card.append(head);
  const showDone=!fresh&&S.done.has(c.id);
  ({learn:buildLearn,blanks:buildBlanks,build:buildBuilder,choice:buildChoice,mc:buildChoice,cloze:buildPassage,bank:buildPassage,struct:buildPassage,read:buildReading})[c.t](c,card,showDone);
  card.append(el('div','ex'));
  if(showDone){setDoneLook(card,c);if(c.html&&c.t!=='read')showPassageEx(c,card)}
  return card;
}

function buildBlanks(c,card,showDone){
  const specs=c.b.map(o=>({opts:shuffle(parseOpts(o))}));
  const filled=specs.map(()=>showDone);
  c.q.forEach(line=>{
    card.append(el('p',c.passage?'line passage en':'line en',line.replace(/\[\[(\d+)\]\]/g,(m,i)=>`<button class="blank" data-i="${i}" aria-label="第 ${+i+1} 格">？</button>`)));
  });
  const blanks=[...card.querySelectorAll('.blank')];
  const tray=el('div','tray');card.append(tray);
  const fill=(i)=>{const b=blanks[i];b.textContent=specs[i].opts.find(o=>o.ok).text;b.classList.add('ok');b.classList.remove('active')};
  if(showDone){blanks.forEach((b,i)=>fill(i));tray.remove();return}
  const setActive=i=>{
    blanks.forEach((b,k)=>b.classList.toggle('active',k===i));
    tray.innerHTML='';
    if(i==null){tray.remove();return}
    tray.append(el('div','lab',`第 ${i+1} 格，選一個填進去`));
    let hb=null,hn=null;
    if(c.hints){hn=el('div','trayhint','💡 '+c.hints[i]);hb=el('button','small','💡 提示');hb.onclick=()=>{hn.classList.add('show');hb.remove()};tray.append(hn)}
    specs[i].opts.forEach(o=>{
      const ch=el('button','chip en',o.text);
      ch.onclick=e=>{
        if(o.ok){
          filled[i]=true;fill(i);anim(blanks[i],'pop');right(blanks[i],e);
          let next=filled.findIndex((f,k)=>!f&&k>i);if(next===-1)next=filled.indexOf(false);
          if(next===-1){setActive(null);complete(c,card,blanks[i],null)}else setActive(next);
        }else{ch.classList.add('no');ch.disabled=true;wrong(blanks[i],c.id);if(hn){hn.classList.add('show');hb&&hb.remove()}}
      };
      tray.append(ch);
    });
    if(hb)tray.append(hb);
  };
  blanks.forEach((b,i)=>b.onclick=()=>{if(!filled[i])setActive(i)});
  setActive(0);
}

function buildBuilder(c,card,showDone){
  card.append(el('p','zh',c.zh));
  const zone=el('div','zone');card.append(zone);
  if(showDone){c.ans.forEach(t=>zone.append(el('span','tile en',t)));zone.classList.add('ok');return}
  const bank=el('div','bank');card.append(bank);
  const tools=el('div','tools');const hint=el('button','small','💡 提示一格');const clear=el('button','small','清空');const msg=el('span','msg','');
  tools.append(hint,clear,msg);card.append(tools);
  const tiles=shuffle([...c.ans,...(c.extra||[])]).map((t,i)=>({t,i}));
  let placed=[];
  tiles.forEach(tile=>{const b=el('button','tile en',tile.t);tile.el=b;b.onclick=e=>place(tile,e);bank.append(b)});
  function render(){
    zone.innerHTML='';
    placed.forEach(tile=>{
      const z=el('button','tile en',tile.t);
      z.onclick=()=>{placed=placed.filter(p=>p!==tile);tile.el.classList.remove('used');msg.textContent='';render()};
      zone.append(z);
    });
  }
  function place(tile,e){
    placed.push(tile);tile.el.classList.add('used');msg.textContent='';render();
    anim(zone.lastChild,'pop');
    if(placed.length===c.ans.length)setTimeout(()=>check(e),180);
  }
  function check(e){
    if(placed.every((p,k)=>p.t===c.ans[k])){zone.classList.add('ok');bank.remove();tools.remove();right(zone,e);complete(c,card,zone,e)}
    else{msg.textContent='有地方不對喔，點上面的方塊可以拿下來';wrong(zone,c.id)}
  }
  hint.onclick=e=>{
    let k=0;while(k<placed.length&&placed[k].t===c.ans[k])k++;
    placed.slice(k).forEach(p=>p.el.classList.remove('used'));placed=placed.slice(0,k);
    const need=tiles.find(t=>t.t===c.ans[k]&&!placed.includes(t));
    combo=0;comboEl.classList.remove('show');S.miss.add(c.id);save();
    render();if(need)place(need,e);
  };
  clear.onclick=()=>{placed.forEach(p=>p.el.classList.remove('used'));placed=[];msg.textContent='';render()};
}

function choiceBox(q,isMC,showDone,onDone,onWrong,cardId){
  const opts=parseOpts(q.opts);
  const box=el('div',!isMC&&opts.every(o=>o.text.length<24)?'opts row':'opts');
  const need=opts.filter(o=>o.ok).length;let got=0;
  const btns=opts.map((o,i)=>{
    const b=el('button','opt',(isMC?`<span class="k">(${LET[i]})</span>`:'')+`<span class="en">${o.text}</span>`);
    if(showDone){if(o.ok)b.classList.add('ok');b.disabled=true}
    b.onclick=e=>{
      b.disabled=true;
      if(o.ok){
        b.classList.add('ok');anim(b,'pop');right(b,e);got++;
        if(got===need){btns.forEach(x=>x.disabled=true);onDone(b,e)}
        else{const[x,y]=pos(b,e);floatText('還有喔！',x,y-36)}
      }else{b.classList.add('no');wrong(b,cardId);onWrong&&onWrong()}
    };
    box.append(b);return b;
  });
  return box;
}
function buildChoice(c,card,showDone){
  card.append(el('p','q en',c.q+(c.multi?' <span style="color:var(--muted);font-weight:400">（正確答案不只一個，全部找出來）</span>':'')));
  card.append(choiceBox(c,c.t==='mc',showDone,(b,e)=>complete(c,card,b,e),()=>showEx(card,c),c.id));
}

function buildLearn(c,card,showDone){
  card.append(el('p','q',c.q));
  const grid=el('div','flips');const seen=new Set();
  c.items.forEach((it,i)=>{
    const f=el('button','flip'+(showDone?' on':''),`<span class="fr"><span class="fe">${it.e}</span><b class="en">${it.f}</b><small>點我翻面</small></span><span class="bk">${it.b}</span>`);
    f.onclick=e=>{
      f.classList.toggle('on');
      if(!seen.has(i)&&!showDone){seen.add(i);S.pts+=5;save();updateStats();const[x,y]=pos(f,e);floatText('+5',x,y-10);
        if(seen.size===c.items.length)complete(c,card,f,e)}
    };
    grid.append(f);
  });
  card.append(grid);
}
/* ---- 題本文章：克漏字 / 文意選填 / 篇章結構 ---- */
function optText(c,n){const a=c.blanks[n].ans;return c.t==='cloze'?c.opts[n][a]:c.t==='bank'?c.bank[a][1]:c.sents[a]}
function showPassageEx(c,card){
  const nums=Object.keys(c.blanks).sort((a,b)=>a-b);
  const ex=card.querySelector('.ex');
  ex.innerHTML='<div class="model">逐格解析</div><ul class="exlist">'+nums.map(n=>`<li><b>(${n}) ${esc(c.t==='struct'?'('+LET[c.blanks[n].ans]+')':optText(c,n))}</b>　${c.blanks[n].note}</li>`).join('')+'</ul>';
  ex.classList.add('show');
}
function buildPassage(c,card,showDone){
  const nums=Object.keys(c.blanks).sort((a,b)=>a-b);
  const used=new Set(),filled={};
  let pool=null;
  if(c.t==='bank'){pool=el('div','pool');c.bank.forEach(([code,w])=>pool.append(el('span','en',`(${code}) ${esc(w)}`)));card.append(pool)}
  if(c.t==='struct'){pool=el('div','pool sents');c.sents.forEach((s,i)=>pool.append(el('span','en',`(${LET[i]}) ${esc(s)}`)));card.append(pool)}
  const psg=el('div','psg');c.html.forEach(h=>psg.append(el('p','',h)));card.append(psg);
  const pbsOf=n=>[...psg.querySelectorAll(`.pb[data-n="${n}"]`)];
  const marksOf=n=>[...psg.querySelectorAll(`.mk[data-for="${n}"]`)];
  const fill=n=>{
    const a=c.blanks[n].ans,txt=c.t==='struct'?`(${LET[a]}) ${c.sents[a]}`:optText(c,n);
    const parts=txt.split('; ');
    pbsOf(n).forEach(b=>{b.textContent=parts.length>1?(parts[+b.dataset.part]||txt):txt;b.classList.add('ok');b.classList.remove('active')});
    filled[n]=1;if(c.t!=='cloze'){used.add(a);if(pool)pool.children[a].classList.add('used')}
  };
  if(showDone){nums.forEach(fill);return}
  const activate=n=>{
    const bl=c.blanks[n];
    const options=c.t==='cloze'?c.opts[n].map((o,i)=>({label:`(${LET[i]}) ${o}`}))
      :c.t==='bank'?c.bank.map(([code,w],i)=>({label:`(${code}) ${w}`,disabled:used.has(i)}))
      :c.sents.map((s,i)=>({label:`(${LET[i]}) ${s}`,disabled:used.has(i),long:true}));
    const pb=pbsOf(n)[0];
    Dock.open({card,title:`${TYPE_NAME[c.t]}（${c.school}）第 ${n} 格`,note:bl.note,options,marks:marksOf(n),pbs:pbsOf(n),
      pick(i,chip,e){
        if(i===bl.ans){
          fill(n);anim(pb,'pop');right(pb,e);
          let next=nums.find(m=>!filled[m]&&+m>+n)||nums.find(m=>!filled[m]);
          if(next){activate(next);const nb=pbsOf(next)[0];const r=nb.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-dockEl.offsetHeight-20)nb.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})}
          else{Dock.close();showPassageEx(c,card);complete(c,card,pb,null)}
        }else{chip.classList.add('no');chip.disabled=true;wrong(pb,c.id);Dock.hint()}
      }});
  };
  nums.forEach(n=>pbsOf(n).forEach(b=>b.onclick=()=>{if(!filled[n])activate(n)}));
}

/* ---- 閱讀測驗 ---- */
function buildReading(c,card,showDone){
  const psg=el('div','psg');c.html.forEach(h=>psg.append(el('p','',h)));card.append(psg);
  const doneQ=new Set();
  c.qs.forEach((q,qi)=>{
    const wrap=el('div','rq');
    wrap.append(el('p','qt en',`${qi+1}. ${esc(q.q)}`+(q.multi?' <span style="color:var(--muted);font-weight:400">（多選，全部找出來）</span>':'')));
    const marks=[...psg.querySelectorAll(`.mk[data-for="q${qi}"]`)];
    const glow=()=>{document.querySelectorAll('.psg .glow').forEach(m=>m.classList.remove('glow'));marks.forEach(m=>m.classList.add('glow'));marks[0]&&marks[0].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'})};
    const ex=el('div','ex',q.ex);
    wrap.append(choiceBox(q,true,showDone,(b,e)=>{
      ex.classList.add('show');doneQ.add(qi);
      if(doneQ.size===c.qs.length)complete(c,card,b,e);
    },()=>{marks.forEach(m=>m.classList.add('glow'))},c.id));
    const tools=el('div','tools');const find=el('button','small','🔍 找線索');find.onclick=glow;tools.append(find);
    wrap.append(tools,ex);
    if(showDone)ex.classList.add('show');
    card.append(wrap);
  });
}

/* ---------- 模式與分頁 ---------- */
const modesEl=document.getElementById('modes'),tabs=document.getElementById('tabs'),panels=document.getElementById('panels');
let mode='gram';try{mode=localStorage.getItem(MODEKEY)||'gram'}catch(e){}
let curTab={gram:'L1',prac:'PL1'};try{Object.assign(curTab,JSON.parse(localStorage.getItem(TABKEY)||'{}'))}catch(e){}
GROUPS.forEach(g=>{const b=el('button','mode',g.name);b.dataset.g=g.id;b.onclick=()=>setMode(g.id,true);modesEl.append(b)});
SECS.forEach(sec=>{
  const p=el('section','panel');p.id='panel-'+sec.key;p.setAttribute('role','tabpanel');
  p.append(el('h2','',sec.emoji+' '+sec.name),el('p','lead',sec.lead));
  if(PRAC.includes(sec)){
    const lg=el('div','legend','<span class="mk mk-c">關聯詞</span><span class="mk mk-g">文法線索</span><span class="mk mk-k">提示詞</span>');
    const tg=el('button','small','');const upd=()=>tg.textContent=document.body.classList.contains('nomarks')?'顯示標記':'隱藏標記';upd();
    tg.onclick=()=>{document.body.classList.toggle('nomarks');try{localStorage.setItem(MARKKEY,document.body.classList.contains('nomarks')?'0':'1')}catch(e){};document.querySelectorAll('.legend .small').forEach(b=>b.textContent=document.body.classList.contains('nomarks')?'顯示標記':'隱藏標記')};
    lg.append(tg);p.append(lg,el('p','lead','點文章裡的 (1)(2) 空格，下面會跳出選項；這格的線索會發亮，卡住就按「💡 提示」。'));
  }
  let last=null;
  sec.cards.forEach(c=>{
    if(c.html&&c.t!==last){p.append(el('div','subhead',TYPE_NAME[c.t]));last=c.t}
    p.append(makeCard(c));
  });
  panels.append(p);
});
try{if(localStorage.getItem(MARKKEY)==='0')document.body.classList.add('nomarks')}catch(e){}
function setMode(g,scroll){
  mode=g;try{localStorage.setItem(MODEKEY,g)}catch(e){}
  modesEl.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===g));
  tabs.innerHTML='';
  GROUPS.find(x=>x.id===g).secs.forEach(sec=>{
    const t=el('button','tab',`${sec.emoji} ${sec.name}<small></small>`);
    t.id='tab-'+sec.key;t.setAttribute('role','tab');
    t.onclick=()=>{select(sec.key);scrollTo({top:document.querySelector('.hero').offsetHeight,behavior:reduce?'auto':'smooth'})};
    tabs.append(t);
  });
  select(curTab[g]);updateStats();
  if(scroll)scrollTo({top:document.querySelector('.hero').offsetHeight,behavior:reduce?'auto':'smooth'});
}
function select(key){
  Dock.close();
  const g=GROUPS.find(x=>x.id===mode);if(!g.secs.some(s=>s.key===key))key=g.secs[0].key;
  curTab[mode]=key;try{localStorage.setItem(TABKEY,JSON.stringify(curTab))}catch(e){}
  SECS.forEach(s=>{const on=s.key===key;const t=document.getElementById('tab-'+s.key);if(t)t.setAttribute('aria-selected',on);document.getElementById('panel-'+s.key).classList.toggle('on',on)});
}
setMode(GROUPS.some(g=>g.id===mode)?mode:'gram');
document.getElementById('reset').onclick=()=>{
  if(!confirm('要清除所有進度、陽光值和成就，重新開始嗎？'))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  location.reload();
};
